<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinners test">
<title>Dinners test</title>
<style>
  :root { --ink: #1f1a1c; --plum: #5b2a4f; --paper: #faf8f5; --line: #e3ddd6; --ok: #2f6b3a; --bad: #9a2a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-weight: 400; font-size: 28px; margin: 0 0 8px; }
  p { margin: 8px 0; }
  textarea { width: 100%; min-height: 96px; font: 16px ui-monospace, Menlo, monospace; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  button { font: 17px -apple-system, system-ui, sans-serif; min-height: 56px; padding: 10px 18px; border-radius: 14px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  button.plum { background: var(--plum); border-color: var(--plum); }
  .row { display: flex; gap: 12px; margin: 12px 0; }
  .row button { flex: 1; }
  .note { color: #6b6266; }
  .err { color: var(--bad); }
  .hidden { display: none; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--bad); margin-right: 6px; vertical-align: -1px; }
  .dot.on { background: var(--ok); }
  .night { display: block; width: 100%; text-align: left; margin: 10px 0; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; transition: background-color .2s; }
  .night b { display: block; font-weight: 600; }
  .night.h { border-color: var(--plum); }
  .night.flash { background: #ead9e5; }
  .night .why { color: var(--bad); display: block; }
  a.reset { color: var(--plum); }
  @media (prefers-reduced-motion: reduce) { .night { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Dinners test</h1>

  <section id="setup" class="hidden">
    <p>Paste the invite code, then tap who you are.</p>
    <textarea id="code" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Invite code"></textarea>
    <p id="setupMsg" class="err"></p>
    <div class="row">
      <button id="imJ">I'm Jason</button>
      <button id="imL" class="plum">I'm Laci</button>
    </div>
  </section>

  <section id="test" class="hidden">
    <div class="bar">
      <span><span id="dot" class="dot"></span><span id="conn">Offline</span></span>
      <a href="#" id="reset" class="reset">Reset</a>
    </div>
    <p id="here" class="note"></p>
    <p id="count" class="note"></p>
    <p id="arrived" class="note">&nbsp;</p>
    <div id="nights"></div>
  </section>
</main>

<script type="module">
const firebaseConfig = {
  apiKey: 'AIzaSyAJOGQmBmtfrZIkyFSIqs7Hbsm0St0rLoY',
  authDomain: 'dinner-41e16.firebaseapp.com',
  databaseURL: 'https://dinner-41e16-default-rtdb.firebaseio.com',
  projectId: 'dinner-41e16',
  storageBucket: 'dinner-41e16.firebasestorage.app',
  messagingSenderId: '617915719782',
  appId: '1:617915719782:web:0ce058ab2337d7c7e5cda7',
};

// ---- PURE HELPERS START ----
function b64urlDecodeToText(s) {
  if (!/^[A-Za-z0-9_-]+$/.test(s)) throw new Error('bad');
  const pad = '='.repeat((4 - (s.length % 4)) % 4);
  const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + pad);
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
}
function decodeInvite(code) {
  try {
    const t = String(code || '').trim();
    if (!t.startsWith('DIN1.')) return null;
    const o = JSON.parse(b64urlDecodeToText(t.slice(5)));
    if (!o || o.v !== 1 || typeof o.k !== 'string' || !o.k || typeof o.c !== 'string') return null;
    if (!/^[A-Za-z0-9_-]+$/.test(o.k)) return null;
    return { k: o.k, c: o.c };
  } catch { return null; }
}
function makeOp() {
  const b = new Uint8Array(12);
  globalThis.crypto.getRandomValues(b);
  return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
}
function nextRev(cur) { return ((cur && cur.rev) || 0) + 1; }
function homeNight(cur, by, at, op) {
  return { st: 'h', m: 'm-spike', s0: 's-spike-a', s1: 's-spike-b', by, at, rev: nextRev(cur), op };
}
function emptyNight(cur, by, at, op) {
  return { st: 'e', by, at, rev: nextRev(cur), op };
}
function toggled(cur, by, at, op) {
  return cur && cur.st === 'h' ? emptyNight(cur, by, at, op) : homeNight(cur, by, at, op);
}
// ---- PURE HELPERS END ----

const STORE = 'dinners.spike.v1';
const WEEK = '2000-01-10';
const NAMES = { J: 'Jason', L: 'Laci' };
const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function load() { try { return JSON.parse(localStorage.getItem(STORE)) || null; } catch { return null; } }
function save(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch {} }
function clear() { try { localStorage.removeItem(STORE); } catch {} }

$('reset').addEventListener('click', (e) => { e.preventDefault(); clear(); location.reload(); });

function showSetup() {
  $('setup').classList.remove('hidden');
  const go = (who) => {
    const inv = decodeInvite($('code').value);
    if (!inv) { $('setupMsg').textContent = "That code didn't work. Copy it again."; return; }
    save({ code: $('code').value.trim(), me: who });
    location.reload();
  };
  $('imJ').addEventListener('click', () => go('J'));
  $('imL').addEventListener('click', () => go('L'));
}

async function start(key, me) {
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const { initializeApp } = await import(SDK + 'firebase-app.js');
  const { getDatabase, ref, onValue, set, runTransaction, onDisconnect, serverTimestamp } = await import(SDK + 'firebase-database.js');
  const other = me === 'J' ? 'L' : 'J';
  const db = getDatabase(initializeApp(firebaseConfig), firebaseConfig.databaseURL);
  const base = `households/${key}`;
  const presenceRef = (w) => ref(db, `${base}/presence/${w}`);

  $('test').classList.remove('hidden');
  let offset = 0, changes = 0;
  onValue(ref(db, '.info/serverTimeOffset'), (s) => { offset = s.val() || 0; });

  const els = [];
  const lastSeen = [];
  const first = [];
  for (let n = 0; n < 7; n++) {
    const b = document.createElement('button');
    b.className = 'night';
    b.innerHTML = `<b>Night ${n + 1}</b><span class="st">empty</span><span class="why"></span>`;
    $('nights').appendChild(b);
    els.push(b); first.push(true); lastSeen.push(null);
    b.addEventListener('click', () => tap(n));
  }

  function render(n, v) {
    const b = els[n];
    const home = v && v.st === 'h';
    b.classList.toggle('h', !!home);
    b.querySelector('.st').textContent = (home ? 'home' : 'empty') + (v && v.by ? ` (set by ${v.by})` : '');
  }

  async function tap(n) {
    const why = els[n].querySelector('.why');
    why.textContent = '';
    try {
      const res = await runTransaction(ref(db, `${base}/weeks/${WEEK}/nights/${n}`),
        (cur) => toggled(cur, me, serverTimestamp(), makeOp()));
      if (!res.committed) why.textContent = "Didn't save: nothing changed";
    } catch (e) {
      const m = String((e && e.message) || e);
      why.textContent = "Didn't save: " + (/permission[_ ]denied/i.test(m) ? 'refused' : m.slice(0, 60));
    }
  }

  for (let n = 0; n < 7; n++) {
    onValue(ref(db, `${base}/weeks/${WEEK}/nights/${n}`), (s) => {
      const v = s.val();
      render(n, v);
      const isFirst = first[n]; first[n] = false;
      if (!v || isFirst || v.op === lastSeen[n]) { lastSeen[n] = v ? v.op : null; return; }
      lastSeen[n] = v.op;
      if (v.by !== other || typeof v.at !== 'number') return;
      changes++;
      $('count').textContent = `changes from ${NAMES[other]}: ${changes}`;
      $('arrived').textContent = `arrived in ${((Date.now() + offset - v.at) / 1000).toFixed(1)} s`;
      if (!reduceMotion) {
        els[n].classList.add('flash');
        setTimeout(() => els[n].classList.remove('flash'), 400);
      }
    });
  }
  $('count').textContent = `changes from ${NAMES[other]}: 0`;

  onValue(presenceRef(other), (s) => {
    const v = s.val();
    $('here').textContent = `${NAMES[other]} is ${v && v.on === true ? 'here' : 'away'}`;
  });

  const setPresence = (on) => set(presenceRef(me), { on, at: serverTimestamp() }).catch(() => {});
  onValue(ref(db, '.info/connected'), (s) => {
    const c = s.val() === true;
    $('dot').classList.toggle('on', c);
    $('conn').textContent = c ? 'Connected' : 'Offline';
    if (c) {
      onDisconnect(presenceRef(me)).set({ on: false, at: serverTimestamp() })
        .then(() => setPresence(document.visibilityState !== 'hidden'))
        .catch(() => {});
    }
  });
  document.addEventListener('visibilitychange', () => setPresence(document.visibilityState === 'visible'));
}

const saved = load();
const inv = saved && decodeInvite(saved.code);
if (inv && (saved.me === 'J' || saved.me === 'L')) {
  start(inv.k, saved.me).catch(() => { $('test').classList.remove('hidden'); $('conn').textContent = 'Offline'; });
} else {
  showSetup();
}
</script>
</body>
</html>
