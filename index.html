<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dinners</title>
<meta name="theme-color" content="#F5EEDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinners">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Dinners week page. Look: mockup A (menu card). Nothing under 16px. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F5EEDF; --panel:#EBE0CB; --ink:#2A2119; --rule:#D8CBB2; --dots:#BFB09A;
  --muted:#6F6252; --faint:#756858; --red:#9B3A26;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html{background:#DDD1BB;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html.locked,html.locked body{height:100%;overflow:hidden}
body{font:400 16px/1.4 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto;background:var(--paper);min-height:100vh;min-height:100dvh;position:relative;padding:calc(22px + env(safe-area-inset-top)) 20px 0}
button{font:inherit;color:inherit;background:none;border:0;text-align:left;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
em{font-style:italic}

/* type pieces */
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:500 16px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.linkbtn{font:500 16px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:10px 0 10px 12px;margin:-10px 0}
h1{font-family:var(--serif);font-variation-settings:'opsz' 144,'SOFT' 50;font-weight:400;font-size:42px;line-height:1.04;letter-spacing:-.02em;margin:14px 0 8px}
h1 em{color:var(--red)}
.sub{font-size:16px;color:var(--muted)}
.mono{font-family:var(--mono)}
.meta{font:500 16px/1.25 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}

/* tabs */
.tabs{display:flex;margin:18px 0 0;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;padding:12px 0 11px;font:600 16px/1.2 var(--sans);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* day rail */
.rail{position:sticky;top:0;z-index:5;display:flex;margin:14px -20px 0;padding:calc(6px + env(safe-area-inset-top) * 0) 14px 0;background:var(--paper);border-top:3px double var(--ink);border-bottom:1px solid var(--rule)}
.rail button{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0 11px;font:600 16px/1 var(--sans);color:var(--muted);min-height:44px}
.rail button.has{color:var(--ink)}
.rail .dots{display:flex;gap:3px}
.rail .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dots);background:transparent}
.rail .dot.on{background:var(--red);border-color:var(--red)}
.rail .dot.pop{animation:pop 260ms cubic-bezier(.2,1.6,.4,1)}
.rail.wave .dot.on{animation:pop 280ms cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--d) * 40ms)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.7)}100%{transform:scale(1)}}

/* days */
.day{display:grid;grid-template-columns:58px 1fr;padding:16px 0 14px;border-bottom:1px solid var(--rule);scroll-margin-top:78px}
.dn{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.1}
.dd{font:500 16px/1 var(--mono);color:var(--muted);margin-top:7px}
.dd.today{color:var(--red);font-weight:600}
.dhead{font:500 16px/1.3 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.dhead .cnt{color:var(--ink);font-weight:600}
.dhead .long{color:var(--red);font-weight:600}
.slot{display:block;width:100%;min-height:44px;position:relative}
.slot.main{padding:2px 0 10px}
.slot.main .t{display:block;font-family:var(--serif);font-variation-settings:'opsz' 36;font-weight:500;font-size:23px;line-height:1.12;letter-spacing:-.01em;margin-bottom:5px}
.slot.side{padding:9px 0 9px;border-top:1px dotted var(--dots)}
.slot.side .t{display:block;font-size:17px;font-weight:600;line-height:1.25;margin-bottom:2px}
.slot.empty .t{color:var(--faint);font-weight:400}
.slot.empty .t:after{content:'+';margin-left:.5em;color:var(--red);font-weight:600;font-style:normal}
.slot.main.empty{padding:10px 0 4px}
.slot.main.empty .t{font-style:italic;font-weight:400;margin:0}
.slot.drop{animation:drop 380ms cubic-bezier(.2,.9,.3,1)}
.slot.drop::before{content:'';position:absolute;inset:0 -8px;background:var(--red);opacity:0;z-index:-1;animation:flash 560ms ease-out}
@keyframes drop{0%{transform:translateY(-22px);opacity:0}55%{transform:translateY(4px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes flash{0%{opacity:.16}100%{opacity:0}}
.longnote{margin-top:6px;font-size:16px;color:var(--red);font-weight:500}
.slot:active{opacity:.7}

/* save bar */
.savebar{position:sticky;bottom:0;z-index:6;margin:18px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:14px}
.savebar .btn{flex:none}
.savebar .st{font-size:16px;line-height:1.25;color:var(--muted)}
.savebar .st b{display:block;color:var(--ink);font-weight:600}
.btn{display:inline-block;white-space:nowrap;background:var(--ink);color:var(--paper);text-align:center;padding:15px 22px;font:600 16px/1.1 var(--sans);letter-spacing:.02em;border-radius:3px;min-height:48px;transition:transform 80ms}
.btn:active{transform:scale(.97)}
.btn.off{background:transparent;color:var(--muted);border:1.5px solid var(--dots)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.block{display:block;width:100%}
.foot{padding:26px 0 30px;font-size:16px;color:var(--muted)}
.sample{font:500 16px/1.2 var(--mono);color:var(--faint);letter-spacing:.04em;text-transform:uppercase}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(42,33,25,.42);opacity:0;transition:opacity 200ms;z-index:20}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;width:100%;max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;background:var(--paper);border-radius:18px 18px 0 0;border-top:3px double var(--ink);box-shadow:0 -10px 30px rgba(42,33,25,.25);transform:translateY(105%);transition:transform 240ms cubic-bezier(.2,.8,.2,1);z-index:21}
.sheet.open{transform:translateY(0)}
.sheet[hidden],.scrim[hidden],.cele[hidden]{display:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--dots);margin:9px auto 0;flex:none}
.sh{flex:none;padding:12px 20px 12px;border-bottom:1px solid var(--rule)}
.sh .eyebrow{margin-bottom:6px}
.sh h2{font-family:var(--serif);font-variation-settings:'opsz' 72;font-weight:500;font-size:28px;line-height:1.08;letter-spacing:-.015em}
.sh h2.sm{font-size:25px}
.sh .meta{margin-top:6px}
.msg{min-height:0;font-size:16px;color:var(--red);font-weight:600;padding:0 20px}
.msg:not(:empty){padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--panel)}
.sb{overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 2px}
.sect h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px;letter-spacing:-.01em}
.sect span{font:500 16px var(--mono);color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;width:100%;padding:12px 0;border-bottom:1px solid var(--rule);min-height:64px}
.row .rn{font-size:18px;font-weight:600;line-height:1.2}
.row.main .rn{font-family:var(--serif);font-variation-settings:'opsz' 36;font-weight:500;font-size:21px}
.row .meta{grid-column:1;margin-top:1px}
.row .rt{grid-column:1;font-size:16px;color:var(--muted);line-height:1.3}
.row .rt .fresh{color:var(--red);font-weight:600}
.row .rk{grid-column:2;grid-row:1/4;align-self:center;font:600 22px/1 var(--sans);color:var(--red);min-width:28px;text-align:right}
.row .rk.txt{font:600 16px/1.2 var(--sans)}
.row.sel{background:var(--panel);margin:0 -20px;padding-left:20px;padding-right:20px;width:calc(100% + 40px)}
.row.minor{padding:9px 0}
.row:active{background:var(--panel)}
.removebtn{display:block;width:100%;padding:14px 0;font:600 16px var(--sans);color:var(--red);border-bottom:1px solid var(--rule);min-height:48px}
.pad{padding-top:14px}
.pad p{font-size:17px;line-height:1.45;margin-bottom:14px}
.pad .btn{margin-bottom:10px}
.note{font-size:16px;line-height:1.4;color:var(--muted);margin:4px 0 12px}
.note.bad{color:var(--red);font-weight:600}
.linkbox{width:100%;font:500 16px var(--mono);padding:12px;border:1.5px solid var(--ink);background:#fff;border-radius:3px;margin-bottom:10px}
.bignote{font-family:var(--serif);font-style:italic;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px}

/* setup */
.setup label{display:block;margin:22px 0 0;font:600 16px var(--sans)}
.setup .hint{display:block;font-weight:400;color:var(--muted);margin:2px 0 8px;font-size:16px;line-height:1.35}
.setup input{display:block;width:100%;font:500 18px var(--sans);padding:13px 12px;border:1.5px solid var(--ink);border-radius:3px;background:#FBF7EC;color:var(--ink)}
.setup .btn{margin-top:26px}
.setup .err{color:var(--red);font-weight:600;margin-top:10px}
.setup .rule{border-top:3px double var(--ink);margin-top:20px}

/* celebration */
.cele{overflow:hidden;position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(42,33,25,.55);transition:opacity 200ms}
.cele.out{opacity:0}
.cele .card{position:relative;text-align:center;width:min(310px,82vw);padding:26px 22px 24px;background:var(--paper);box-shadow:0 18px 40px rgba(0,0,0,.35);border-top:3px double var(--ink);border-bottom:3px double var(--ink);animation:stamp 360ms cubic-bezier(.2,1.5,.4,1) both;transform:rotate(-2deg)}
.cele h2{font-family:var(--serif);font-variation-settings:'opsz' 144,'SOFT' 50;font-weight:400;font-style:italic;font-size:48px;line-height:1;letter-spacing:-.02em;color:var(--red)}
.cele p{margin-top:10px;font-size:18px;color:var(--ink)}
.cele .meta{margin-bottom:10px;display:block}
.cele .link{display:block;margin-top:14px;font:500 16px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bit{position:absolute;left:50%;top:50%;width:9px;height:15px;margin:-7px 0 0 -4px;border-radius:1px;opacity:0;animation:burst 500ms cubic-bezier(.1,.8,.3,1) both;animation-delay:calc(var(--i) * 2ms)}
@keyframes stamp{0%{transform:scale(1.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.5);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}
.cele.hold .bit{animation:none;transform:translate(calc(var(--x) * .62),calc(var(--y) * .62)) rotate(var(--r));opacity:1}

/* Store list view */
.bigcount{display:flex;align-items:flex-end;gap:14px;margin:20px 0 0}
.bigcount b{font-family:var(--serif);font-variation-settings:'opsz' 144,'SOFT' 50;font-weight:400;font-size:96px;line-height:.82;letter-spacing:-.04em;color:var(--ink)}
.bigcount .of{font-family:var(--serif);font-size:34px;line-height:1;color:var(--muted);letter-spacing:-.02em;margin-left:4px}
.bigcount .lbl{font-size:18px;line-height:1.2;color:var(--ink);padding-bottom:4px}
.bar{height:5px;background:var(--rule);margin:16px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width 300ms}
.aisle{margin-top:24px}
.aisle h2{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-weight:500;font-size:25px;letter-spacing:-.01em;border-bottom:1px solid var(--ink);padding-bottom:6px}
.aisle h2 span{font:500 16px var(--mono);color:var(--muted);letter-spacing:.02em}
.it{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:2px 14px;width:100%;padding:11px 0;border-bottom:1px solid #E1D6C0;min-height:56px}
.cb{grid-row:1/3;width:26px;height:26px;border:1.5px solid var(--ink);border-radius:2px;position:relative;align-self:center}
.it .nm{font-size:18px;font-weight:500;line-height:1.25}
.it .qty{grid-row:1/3;grid-column:3;font-size:17px;color:var(--muted);text-align:right;white-space:nowrap}
.it .dy{grid-column:2;font:500 16px/1.2 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.it.done .cb{background:var(--ink)}
.it.done .cb:after{content:'';position:absolute;left:8px;top:2px;width:7px;height:14px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);animation:tick 160ms ease-out}
.it.done .nm{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
@keyframes tick{0%{transform:rotate(45deg) scale(.2)}100%{transform:rotate(45deg) scale(1)}}
.cook{margin-top:38px}
.cook h2{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.015em;line-height:1.05;margin:10px 0 14px}
.cook h2 em{color:var(--red)}
.dayrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;padding:15px 0;border-bottom:1px solid var(--rule);min-height:52px}
.dayrow .a{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.2}
.dayrow .a i{font-weight:400;color:var(--muted);margin-right:8px;display:inline-block;width:42px}
.dayrow .b{color:var(--muted);font:500 26px/1 var(--sans)}
.cookwrap{border-top:1px solid var(--ink)}
.dayopen{background:var(--panel);margin:0 -20px;padding:2px 20px 20px;border-bottom:1px solid var(--rule)}
.dayopen .dayrow{border:0;padding:12px 0 8px}
.dayopen .dayrow .b{color:var(--red)}
.pairs{font-size:17px;line-height:1.45;color:#3A2F25;margin-bottom:12px}
.needs{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 6px}
.needs b{font:500 16px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-right:6px;color:var(--ink)}
.dish{margin-top:18px;padding-top:12px;border-top:1px solid var(--dots)}
.dish h3{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.15}
.dish .meta{margin:3px 0 8px}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;font-size:17px;line-height:1.42;padding:8px 0;border-top:1px dotted var(--dots)}
.steps li:before{content:counter(s);font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.1;color:var(--red)}
.cdo{display:inline-block;margin-top:6px;padding:13px 18px;border:1.5px solid var(--ink);border-radius:3px;font:600 16px var(--sans);text-decoration:none;min-height:48px}
.err-page{padding-top:8px}
.err-page p{font-size:18px;line-height:1.45;margin:6px 0 20px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <div class="sh" id="sheetHead"></div>
  <div class="msg" id="sheetMsg" role="status" aria-live="polite"></div>
  <div class="sb" id="sheetBody"></div>
</div>
<div class="cele" id="cele" hidden></div>

<script>
// Dinners page logic. Plain ES module, no dependencies. Works in iOS Safari and Node 18+.
// Shapes follow work-orders/SCHEMA-meals-and-rules.md.

const TZ = 'America/Chicago';
const DAY_COUNT = 7;

// ---------- dates ----------

function pad(n) { return String(n).padStart(2, '0'); }

function isoFromUTC(ms) {
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
}

function utcMs(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return NaN;
  const ms = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  return isoFromUTC(ms) === iso ? ms : NaN; // rejects 2026-02-31 and similar
}

function isValidISODate(iso) {
  return typeof iso === 'string' && !Number.isNaN(utcMs(iso));
}

function addDays(iso, n) {
  return isoFromUTC(utcMs(iso) + n * 86400000);
}

// Calendar date (YYYY-MM-DD) and weekday (Mon=0 .. Sun=6) of an instant in a time zone.
function localDate(now, tz = TZ) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(now);
  const get = (t) => parts.find((p) => p.type === t).value;
  const iso = `${get('year')}-${get('month')}-${get('day')}`;
  const dow = (new Date(utcMs(iso)).getUTCDay() + 6) % 7;
  return { iso, dow };
}

// The Monday on or before today.
function thisMonday(now, tz = TZ) {
  const { iso, dow } = localDate(now, tz);
  return addDays(iso, -dow);
}

// Tuesday-Sunday: the next Monday. Monday: the Monday 7 days later.
function comingMonday(now, tz = TZ) {
  const { iso, dow } = localDate(now, tz);
  return addDays(iso, 7 - dow);
}

function daysBetween(fromISO, toISO) {
  return Math.round((utcMs(toISO) - utcMs(fromISO)) / 86400000);
}

// ---------- weeks ----------

function emptyWeek(monday) {
  return { v: 1, monday, days: Array.from({ length: DAY_COUNT }, () => null) };
}

function findItem(meals, id) {
  if (!meals || typeof id !== 'string') return null;
  for (const list of [meals.mains, meals.sides]) {
    if (!Array.isArray(list)) continue;
    for (const it of list) if (it.id === id) return it;
  }
  return null; // retired items are still in the lists, so they are found
}

function dayMain(day) { return day && day.main ? day.main : null; }
function daySides(day) { return day && Array.isArray(day.sides) ? day.sides : []; }

function canSave(week) {
  return !!(week && Array.isArray(week.days) && week.days.some((d) => dayMain(d)));
}

function isCelebration(week) {
  if (!week || !Array.isArray(week.days)) return false;
  const withMain = week.days.filter((d) => dayMain(d));
  if (withMain.length < 4) return false;
  return withMain.every((d) => daySides(d).filter(Boolean).length === 2);
}

// slot: 'main', 0 or 1 (side position). id null clears the slot.
// Returns { ok:true, week } (a new object) or { ok:false, error }.
function validatePick(week, dayIndex, slot, id) {
  if (!week || !Array.isArray(week.days)) return { ok: false, error: 'no week' };
  if (!Number.isInteger(dayIndex) || dayIndex < 0 || dayIndex >= DAY_COUNT) return { ok: false, error: 'bad day' };
  if (slot !== 'main' && slot !== 0 && slot !== 1) return { ok: false, error: 'bad slot' };
  if (id !== null && typeof id !== 'string') return { ok: false, error: 'bad id' };
  if (id !== null) {
    if (slot === 'main' && !id.startsWith('m-')) return { ok: false, error: 'not a main' };
    if (slot !== 'main' && !id.startsWith('s-')) return { ok: false, error: 'not a side' };
  }
  const cur = week.days[dayIndex] || { main: null, sides: [null, null] };
  const sides = [cur.sides && cur.sides[0] || null, cur.sides && cur.sides[1] || null];
  let main = cur.main || null;
  if (slot === 'main') {
    main = id;
  } else {
    const other = sides[slot === 0 ? 1 : 0];
    if (id !== null && other === id) return { ok: false, error: 'That side is already on this day.' };
    sides[slot] = id; // replaces any earlier pick
  }
  const day = (main || sides[0] || sides[1]) ? { main, sides } : null;
  const days = week.days.slice();
  days[dayIndex] = day;
  return { ok: true, week: { ...week, days } };
}

// ---------- dinner time ----------

function lanePair(minutesList) {
  const slots = [0, 0];
  for (const m of [...minutesList].sort((a, b) => b - a)) {
    slots[slots[0] <= slots[1] ? 0 : 1] += m;
  }
  return Math.max(slots[0], slots[1]);
}

function dinnerMinutes(main, sides) {
  const items = [main, ...(sides || [])].filter(Boolean);
  const oven = new Map(); // temp -> longest minutes
  let thermomix = 0;
  const pairLanes = { stovetop: [], 'ninja-grill': [] };
  let best = 0;
  for (const it of items) {
    const m = Number(it.minutes) || 0;
    switch (it.appliance) {
      case 'oven': {
        const k = String(it.ovenTempF);
        oven.set(k, Math.max(oven.get(k) || 0, m));
        break;
      }
      case 'thermomix': thermomix += m; break;
      case 'stovetop':
      case 'ninja-grill': pairLanes[it.appliance].push(m); break;
      default: best = Math.max(best, m); // none: its own lane
    }
  }
  let ovenTotal = 0;
  for (const v of oven.values()) ovenTotal += v;
  return Math.max(best, ovenTotal, thermomix, lanePair(pairLanes.stovetop), lanePair(pairLanes['ninja-grill']));
}

// ---------- store list ----------

function round(n) { return Math.round(n * 1000) / 1000; }

// Returns [{ aisle, items: [{ name, unit, amount, days:[dayIndex...] }] }] in aisle order.
function buildStoreList(week, meals) {
  const lines = new Map(); // key -> line
  const days = week && Array.isArray(week.days) ? week.days : [];
  days.forEach((day, di) => {
    if (!day) return;
    const ids = [day.main, ...daySides(day)].filter(Boolean);
    for (const id of ids) {
      const item = findItem(meals, id);
      if (!item || !Array.isArray(item.ingredients)) continue;
      for (const ing of item.ingredients) {
        const name = String(ing.name).trim();
        const unit = String(ing.unit).trim();
        const key = `${ing.aisle}\u0000${name.toLowerCase()}\u0000${unit.toLowerCase()}`;
        let line = lines.get(key);
        if (!line) {
          line = { name, unit, amount: 0, aisle: ing.aisle, days: [] };
          lines.set(key, line);
        }
        line.amount = round(line.amount + Number(ing.amount));
        if (!line.days.includes(di)) line.days.push(di);
      }
    }
  });
  const order = (meals && meals.aisles) || [];
  const groups = new Map();
  for (const line of lines.values()) {
    if (!groups.has(line.aisle)) groups.set(line.aisle, []);
    const { aisle, ...rest } = line;
    rest.days.sort((a, b) => a - b);
    groups.get(aisle).push(rest);
  }
  const aisleNames = [...groups.keys()].sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
  return aisleNames.map((aisle) => ({
    aisle,
    items: groups.get(aisle).sort((a, b) =>
      a.name.toLowerCase().localeCompare(b.name.toLowerCase()) || a.unit.localeCompare(b.unit)),
  }));
}

// ---------- link ----------

function toB64url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromB64url(s) {
  if (!/^[A-Za-z0-9_-]*$/.test(s)) throw new Error('not base64url');
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
}

// Compact form: { v, m: monday, d: [null | [main, side0, side1] x7] }
function encodeWeek(week) {
  const compact = {
    v: 1,
    m: week.monday,
    d: week.days.map((day) => day
      ? [day.main || null, daySides(day)[0] || null, daySides(day)[1] || null]
      : null),
  };
  return toB64url(JSON.stringify(compact));
}

const ID_RE = /^[a-z0-9]+(-[a-z0-9]+)*$/;

function decodeWeek(str) {
  try {
    if (typeof str !== 'string') return { ok: false, error: 'no link value' };
    let s = str.trim();
    const at = s.indexOf('w=');
    if (at >= 0) s = s.slice(at + 2);
    else if (s.startsWith('#')) s = s.slice(1);
    if (!s) return { ok: false, error: 'empty' };
    const c = JSON.parse(fromB64url(s));
    if (!c || typeof c !== 'object' || c.v !== 1) return { ok: false, error: 'unknown version' };
    if (!isValidISODate(c.m)) return { ok: false, error: 'bad date' };
    if (!isMonday(c.m)) return { ok: false, error: 'week does not start on a Monday' };
    if (!Array.isArray(c.d) || c.d.length !== DAY_COUNT) return { ok: false, error: 'bad days' };
    const idOk = (v, p) => v === null || (typeof v === 'string' && v.startsWith(p) && ID_RE.test(v.slice(2)) && v.length <= 80);
    const days = [];
    for (const d of c.d) {
      if (d === null) { days.push(null); continue; }
      if (!Array.isArray(d) || d.length !== 3) return { ok: false, error: 'bad day' };
      if (!idOk(d[0], 'm-') || !idOk(d[1], 's-') || !idOk(d[2], 's-')) return { ok: false, error: 'bad id' };
      if (d[1] && d[1] === d[2]) return { ok: false, error: 'same side twice' };
      days.push(d[0] || d[1] || d[2] ? { main: d[0], sides: [d[1], d[2]] } : null);
    }
    return { ok: true, week: { v: 1, monday: c.m, days } };
  } catch (e) {
    return { ok: false, error: 'damaged link' };
  }
}

function weekLink(base, week) {
  return `${base}#w=${encodeWeek(week)}`;
}

// ---------- last had ----------

// savedWeeks: array of weeks (a later entry with the same Monday replaces an earlier one)
// or an object keyed by Monday. Returns { [id]: { daysAgo: number|null, label } }.
function isMonday(iso) {
  return isValidISODate(iso) && new Date(iso + 'T12:00:00Z').getUTCDay() === 1;
}

// How many times each id was picked across all saved weeks (any day, past or coming).
// A re-saved Monday replaces the earlier save, as in lastHad.
function pickCounts(savedWeeks, ids) {
  const byMonday = new Map();
  const list = Array.isArray(savedWeeks) ? savedWeeks : Object.values(savedWeeks || {});
  for (const w of list) if (w && isValidISODate(w.monday)) byMonday.set(w.monday, w);
  const count = {};
  for (const w of byMonday.values()) {
    for (const day of w.days) {
      if (!day) continue;
      for (const id of [day.main, ...daySides(day)]) if (id) count[id] = (count[id] || 0) + 1;
    }
  }
  const out = {};
  for (const id of ids) out[id] = count[id] || 0;
  return out;
}

function lastHad(savedWeeks, todayISO, ids) {
  const byMonday = new Map();
  const list = Array.isArray(savedWeeks) ? savedWeeks : Object.values(savedWeeks || {});
  for (const w of list) if (w && isValidISODate(w.monday)) byMonday.set(w.monday, w);
  const latest = {}; // id -> most recent date before today
  for (const w of byMonday.values()) {
    w.days.forEach((day, i) => {
      if (!day) return;
      const date = addDays(w.monday, i);
      if (date >= todayISO) return; // today and future do not count
      for (const id of [day.main, ...daySides(day)]) {
        if (id && (!latest[id] || date > latest[id])) latest[id] = date;
      }
    });
  }
  const out = {};
  for (const id of ids) {
    if (!latest[id]) { out[id] = { daysAgo: null, label: 'not yet' }; continue; }
    const n = daysBetween(latest[id], todayISO);
    out[id] = { daysAgo: n, label: n === 1 ? 'yesterday' : `${n} days ago` };
  }
  return out;
}

// All personal settings live in localStorage on the phone, never in this file.
(function () {
'use strict';

const FX = window.__FIXTURE || null; // set only by the check fixtures: fixed "today", fixed state, in-memory storage
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAYS_FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const APPL = { 'thermomix': 'Thermomix', 'ninja-grill': 'Ninja grill', 'oven': 'Oven', 'stovetop': 'Stovetop', 'none': 'No cook' };
const PREFIX = 'dinners.v1.';

const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const now = () => (FX && FX.now ? new Date(FX.now) : new Date());
const todayISO = () => localDate(now()).iso;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// ---------- storage (localStorage, or memory when it is not available / in fixtures) ----------
const mem = {};
if (FX && FX.storage) for (const k of Object.keys(FX.storage)) mem[PREFIX + k] = JSON.stringify(FX.storage[k]);
let ls = null;
if (!FX) { try { ls = window.localStorage; ls.setItem(PREFIX + 't', '1'); ls.removeItem(PREFIX + 't'); } catch (e) { ls = null; } }
const store = {
  get(k, d) {
    let raw = null;
    try { raw = (!ls || (PREFIX + k) in mem) ? mem[PREFIX + k] : ls.getItem(PREFIX + k); } catch (e) { raw = null; }
    if (raw == null) return d;
    try { const v = JSON.parse(raw); return v == null ? d : v; } catch (e) { return d; }
  },
  set(k, v) {
    const raw = JSON.stringify(v);
    if (ls) { try { ls.setItem(PREFIX + k, raw); delete mem[PREFIX + k]; return true; } catch (e) { /* fall through to memory */ } }
    mem[PREFIX + k] = raw;
    return !ls && !!FX; // fixtures use memory on purpose; otherwise the change is lost when the page closes
  },
};

// ---------- state ----------
const S = {
  settings: store.get('settings', null),
  saved: store.get('weeks', {}),
  drafts: store.get('drafts', {}),
  celebrated: store.get('celebrated', {}),
  which: FX && FX.which === 'this' ? 'this' : 'coming',
  week: null,
  sheet: null,      // { kind:'main'|'side'|'result'|'cele', day, slot }
  popped: null,     // { day, slot } the slot that just changed, for the drop
  setupOpen: !!(FX && FX.setup),
  setupFirst: false,
  openDay: FX && typeof FX.openDay === 'number' ? FX.openDay : null,
  result: null,
  hist: null,
};
for (const k of ['saved', 'drafts', 'celebrated']) if (!S[k] || typeof S[k] !== 'object' || Array.isArray(S[k])) S[k] = {};

function validWeek(w, monday) {
  return w && w.monday === monday && Array.isArray(w.days) && w.days.length === 7 ? w : null;
}
function mondayNow() { return S.which === 'this' ? thisMonday(now()) : comingMonday(now()); }
function loadWeek() {
  const mon = mondayNow();
  S.week = validWeek(S.drafts[mon], mon) || validWeek(S.saved[mon], mon) || emptyWeek(mon);
}
function saveDraft() { S.drafts[S.week.monday] = S.week; store.set('drafts', S.drafts); }

// ---------- display helpers ----------
const item = (id) => findItem(MEALS, id);
function dateParts(iso) { const [y, m, d] = iso.split('-').map(Number); return { y, m, d }; }
function shortDate(iso) { const p = dateParts(iso); return MONTHS[p.m - 1] + ' ' + p.d; }
function applianceName(it) { return it.appliance === 'oven' && it.ovenTempF ? `Oven ${it.ovenTempF}°F` : (APPL[it.appliance] || it.appliance); }
function metaLine(it) { return `${applianceName(it)} · ${it.minutes} min`; }
function history() {
  if (!S.hist) {
    const ids = MEALS.mains.concat(MEALS.sides).map((i) => i.id);
    const list = Object.values(S.saved);
    S.hist = { last: lastHad(list, todayISO(), ids), counts: pickCounts(list, ids) };
  }
  return S.hist;
}
function tagsHTML(it) {
  const h = history(), l = h.last[it.id] || { daysAgo: null, label: 'not yet' };
  const fresh = l.daysAgo === null || l.daysAgo >= 21;
  return `<span class="${fresh ? 'fresh' : ''}">Last had: ${esc(l.label)}</span> · <span>picked ${h.counts[it.id] || 0}×</span>`;
}
function dayCount(day) {
  if (!day) return 0;
  return (day.main ? 1 : 0) + (day.sides || []).filter(Boolean).length;
}
function dayMinutes(day) {
  if (!day) return 0;
  return dinnerMinutes(day.main ? item(day.main) : null, (day.sides || []).map(item).filter(Boolean));
}
function herName() { return S.settings && S.settings.her ? S.settings.her : ''; }
function himName() { return S.settings && S.settings.him ? S.settings.him : ''; }

// ---------- routing ----------
const getHash = () => (FX && FX.hash != null ? FX.hash : window.location.hash);
const pageAddress = () => (FX && FX.address) || window.location.href.split('#')[0];

function route() {
  const app = $('#app');
  closeSheet(true);
  hideCele(true);
  const h = getHash();
  if (h.indexOf('#w=') === 0) return renderList(app, h);
  if (S.setupOpen || !S.settings || !S.settings.channel) return renderSetup(app);
  mountBuilder(app);
}
window.addEventListener('hashchange', () => { if (!FX) route(); });

// ---------- setup ----------
function renderSetup(app) {
  S.setupFirst = !(S.settings && S.settings.channel);
  const s = S.settings || {};
  app.innerHTML = `<div class="setup">
    <div class="eyebrow"><span>${S.setupFirst ? 'First time' : 'Settings'}</span>${S.setupFirst ? '' : '<button class="linkbtn" data-act="setup-cancel">Cancel</button>'}</div>
    <h1>A quick <em>setup</em></h1>
    <p class="sub">Once, on this phone. It is kept here, never in the page or any shared file.</p>
    <div class="rule"></div>
    <form id="setupForm" novalidate>
      <label for="f-channel">Notification channel<span class="hint">The private channel name the other phone listens to. Type it exactly.</span></label>
      <input id="f-channel" name="channel" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" value="${esc(s.channel || '')}" placeholder="the-channel-name">
      <label for="f-her">Your first name<span class="hint">Optional. Used in the headings.</span></label>
      <input id="f-her" name="her" type="text" autocomplete="off" value="${esc(s.her || '')}" placeholder="First name">
      <label for="f-him">Who cooks, first name<span class="hint">Optional. Shown where the list is sent.</span></label>
      <input id="f-him" name="him" type="text" autocomplete="off" value="${esc(s.him || '')}" placeholder="First name">
      <div class="err" id="setupErr" role="alert"></div>
      <button class="btn block" type="submit">${S.setupFirst ? 'Save and start' : 'Save settings'}</button>
    </form>
  </div>`;
  const form = $('#setupForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const channel = $('#f-channel').value.trim();
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(channel)) {
      $('#setupErr').textContent = 'Use letters, numbers, dashes or underscores only, up to 64 characters.';
      return;
    }
    S.settings = { channel, her: $('#f-her').value.trim(), him: $('#f-him').value.trim() };
    store.set('settings', S.settings);
    S.setupOpen = false;
    route();
  });
}

// ---------- Week builder view ----------
function mountBuilder(app) {
  loadWeek();
  S.hist = null;
  app.innerHTML = `<header id="head"></header><nav class="rail" id="rail" aria-label="Days"></nav><main id="days"></main><div class="savebar" id="bar"></div><div class="foot" id="foot"></div>`;
  renderAll();
  if (FX && FX.sheet) openSheet(FX.sheet.day, FX.sheet.slot);
  if (FX && FX.celebrate) celebrate(true);
}

function renderAll() { renderHead(); renderRail(); renderDays(); renderBar(); }

function renderHead() {
  const mon = S.week.monday, her = herName();
  const nMain = S.week.days.filter((d) => d && d.main).length;
  const c = comingMonday(now()), t = thisMonday(now());
  $('#head').innerHTML = `
    <div class="eyebrow"><span>Week of ${shortDate(mon)}</span><button class="linkbtn" data-act="settings">Settings</button></div>
    <h1>What's for <em>dinner</em>${her ? ', ' + esc(her) : ''}?</h1>
    <p class="sub">${nMain === 0 ? 'Pick a main for each night you are cooking.' : nMain === 1 ? '1 night has a main so far.' : nMain + ' nights have a main so far.'}</p>
    <div class="tabs" role="group" aria-label="Week">
      <button data-act="tab" data-which="coming" aria-pressed="${S.which === 'coming'}">Coming week · ${shortDate(c)}</button>
      <button data-act="tab" data-which="this" aria-pressed="${S.which === 'this'}">This week · ${shortDate(t)}</button>
    </div>`;
}

function renderRail() {
  const p = S.popped;
  const wave = S.wave;
  $('#rail').className = 'rail' + (wave ? ' wave' : '');
  $('#rail').innerHTML = S.week.days.map((day, i) => {
    const filled = [!!(day && day.main), !!(day && day.sides && day.sides[0]), !!(day && day.sides && day.sides[1])];
    const dots = filled.map((f, k) => {
      const pop = p && p.day === i && (p.slot === 'main' ? k === 0 : k === 1 + p.slot) ? ' pop' : '';
      return `<span class="dot${f ? ' on' : ''}${pop}" style="--d:${i}"></span>`;
    }).join('');
    return `<button data-act="rail" data-day="${i}" class="${dayCount(day) ? 'has' : ''}" aria-label="${DAYS_FULL[i]}, ${dayCount(day)} of 3">${DAYS[i]}<span class="dots">${dots}</span></button>`;
  }).join('');
}

function slotHTML(dayIdx, slot, id, dropped) {
  const isMain = slot === 'main';
  const it = id ? item(id) : null;
  const cls = `slot ${isMain ? 'main' : 'side'}${it ? '' : ' empty'}${dropped ? ' drop' : ''}`;
  const label = isMain ? (it ? `Main: ${it.name}. Change` : 'Choose a main') : (it ? `Side: ${it.name}. Change` : 'Add a side');
  if (!it) {
    return `<button class="${cls}" data-act="slot" data-day="${dayIdx}" data-slot="${slot}" aria-label="${label}"><span class="t">${isMain ? 'Choose a main' : 'Add a side'}</span></button>`;
  }
  return `<button class="${cls}" data-act="slot" data-day="${dayIdx}" data-slot="${slot}" aria-label="${esc(label)}"><span class="t">${esc(it.name)}</span><span class="meta">${esc(metaLine(it))}</span></button>`;
}

function renderDays() {
  const mon = S.week.monday, today = todayISO(), p = S.popped;
  $('#days').innerHTML = S.week.days.map((day, i) => {
    const date = addDays(mon, i), dp = dateParts(date);
    const main = day && day.main, sides = (day && day.sides) || [null, null];
    const any = dayCount(day) > 0;
    const showSides = !!(main || sides[0] || sides[1]);
    const mins = any ? dayMinutes(day) : 0;
    const long = mins > 30;
    const dropMain = p && p.day === i && p.slot === 'main';
    let h = `<section class="day" id="day-${i}"><div><div class="dn">${DAYS[i]}</div><div class="dd${date === today ? ' today' : ''}">${date === today ? 'Today' : dp.d}</div></div><div>`;
    if (any) {
      h += `<div class="dhead"><span><span class="cnt">${dayCount(day)} of 3</span> \u00B7 <span class="${long ? 'long' : ''}">dinner in ${long ? 'about ' : ''}${mins} min</span></span></div>`;
    } else {
      h += `<div class="dhead"><span><span class="cnt">0 of 3</span></span></div>`;
    }
    h += slotHTML(i, 'main', main, dropMain);
    if (showSides) {
      h += slotHTML(i, 0, sides[0], p && p.day === i && p.slot === 0);
      h += slotHTML(i, 1, sides[1], p && p.day === i && p.slot === 1);
    }
    if (long) h += `<p class="longnote">About ${mins} min for this one. A bit long for a weeknight, but nothing is blocked.</p>`;
    return h + '</div></section>';
  }).join('');
  S.popped = null;
}

function renderBar() {
  const n = S.week.days.filter((d) => d && d.main).length;
  const mon = S.week.monday;
  const saved = S.saved[mon];
  const same = saved && JSON.stringify(saved.days) === JSON.stringify(S.week.days);
  const ok = canSave(S.week);
  const line = same ? 'Saved' : saved ? 'Changes not saved' : (n ? (n === 1 ? '1 dinner planned' : n + ' dinners planned') : 'Nothing planned yet');
  const sub = same ? (n + (n === 1 ? ' dinner' : ' dinners')) : (himName() ? `Saving sends the list to ${esc(himName())}'s phone.` : 'Saving sends the list to the cook’s phone.');
  $('#bar').innerHTML = `<div class="st"><b>${line}</b>${sub}</div><button class="btn${ok ? '' : ' off'}" data-act="save" ${ok ? '' : 'aria-disabled="true"'}>Save week</button>`;
  $('#foot').innerHTML = FX ? '<div class="sample">Sample data · assumed</div>' : '';
}

// ---------- sheets ----------
let sheetTimer = null;
function showSheet() {
  const sheet = $('#sheet'), scrim = $('#scrim');
  clearTimeout(sheetTimer);
  sheet.hidden = false; scrim.hidden = false;
  document.documentElement.classList.add('locked');
  void sheet.offsetHeight;
  sheet.classList.add('open'); scrim.classList.add('open');
  $('#sheetBody').scrollTop = 0;
}
function closeSheet(instant) {
  const sheet = $('#sheet'), scrim = $('#scrim');
  if (sheet.hidden) { S.sheet = null; return; }
  sheet.classList.remove('open'); scrim.classList.remove('open');
  S.sheet = null;
  document.documentElement.classList.remove('locked');
  clearTimeout(sheetTimer);
  const done = () => { if (!S.sheet) { sheet.hidden = true; scrim.hidden = true; } };
  if (instant || reduced()) done(); else sheetTimer = setTimeout(done, 250);
}
function setMsg(t) { $('#sheetMsg').textContent = t || ''; }

function rowHTML(it, opts) {
  const kind = opts.main ? ' main' : '';
  const mark = opts.mark;
  return `<button class="row${kind}${opts.sel ? ' sel' : ''}${opts.minor ? ' minor' : ''}" data-act="choose" data-id="${esc(it.id)}">
    <span class="rn">${esc(it.name)}</span>
    <span class="meta">${esc(metaLine(it))}</span>
    <span class="rt">${tagsHTML(it)}</span>
    <span class="rk${mark && mark.length > 1 ? ' txt' : ''}">${mark || '+'}</span></button>`;
}

function openSheet(dayIdx, slot) {
  if (typeof slot === 'string' && slot !== 'main') slot = Number(slot);
  const day = S.week.days[dayIdx];
  const date = addDays(S.week.monday, dayIdx), dp = dateParts(date);
  const dayLabel = `${DAYS[dayIdx]} ${MONTHS[dp.m - 1]} ${dp.d}`;
  const head = $('#sheetHead'), body = $('#sheetBody');
  setMsg('');
  if (slot === 'main') {
    S.sheet = { kind: 'main', day: dayIdx, slot };
    const cur = day && day.main;
    head.innerHTML = `<div class="eyebrow"><span>${dayLabel}</span><button class="linkbtn" data-act="close">Close</button></div><h2 id="sheetTitle">Choose a main</h2>`;
    const groups = {};
    MEALS.mains.filter((m) => !m.retired).forEach((m) => { (groups[m.protein] = groups[m.protein] || []).push(m); });
    let h = cur ? `<button class="removebtn" data-act="remove">Remove ${esc(item(cur) ? item(cur).name : 'this main')} from this day</button>` : '';
    Object.keys(groups).sort().forEach((pr) => {
      h += `<div class="sect"><h3>${esc(cap(pr))}</h3><span>${groups[pr].length}</span></div>`;
      groups[pr].sort((a, b) => a.name.localeCompare(b.name)).forEach((m) => {
        h += rowHTML(m, { main: true, sel: m.id === cur, mark: m.id === cur ? 'On this day' : '+' });
      });
    });
    body.innerHTML = h;
  } else {
    S.sheet = { kind: 'side', day: dayIdx, slot };
    const main = day && day.main ? item(day.main) : null;
    const cur = day && day.sides ? day.sides[slot] : null;
    const onDay = (day && day.sides ? day.sides : []).filter(Boolean);
    head.innerHTML = `<div class="eyebrow"><span>${dayLabel} · side ${slot + 1} of 2</span><button class="linkbtn" data-act="close">Close</button></div>
      <h2 class="sm" id="sheetTitle">${main ? esc(main.name) : 'Choose a side'}</h2>${main ? `<div class="meta">${esc(metaLine(main))}</div>` : ''}`;
    const live = MEALS.sides.filter((s) => !s.retired);
    const good = [], rest = [];
    const goes = main && Array.isArray(main.goesWith) ? main.goesWith : [];
    goes.forEach((id) => { const s = live.find((x) => x.id === id); if (s) good.push(s); });
    live.forEach((s) => { if (!good.includes(s)) rest.push(s); });
    rest.sort((a, b) => a.name.localeCompare(b.name));
    const mk = (s, minor) => rowHTML(s, { minor, sel: s.id === cur, mark: s.id === cur ? 'Picked' : onDay.includes(s.id) ? 'On this day' : '+' });
    let h = cur ? `<button class="removebtn" data-act="remove">Remove ${esc(item(cur) ? item(cur).name : 'this side')} from this day</button>` : '';
    if (good.length) {
      h += `<div class="sect"><h3>Goes well with</h3><span>${good.length}</span></div>` + good.map((s) => mk(s, false)).join('');
    }
    h += `<div class="sect"><h3>${good.length ? 'All other sides' : 'All sides'}</h3><span>${rest.length}</span></div>` + rest.map((s) => mk(s, true)).join('');
    body.innerHTML = h;
  }
  showSheet();
}

function choose(id) {
  const sh = S.sheet; if (!sh) return;
  const before = S.week.days[sh.day];
  const hadSides = !!(before && before.sides && (before.sides[0] || before.sides[1]));
  const r = validatePick(S.week, sh.day, sh.slot, id);
  if (!r.ok) { setMsg(r.error); return; }
  applyPick(sh.day, sh.slot, r.week, sh.slot === 'main' && !hadSides);
}
function removePick() {
  const sh = S.sheet; if (!sh) return;
  const r = validatePick(S.week, sh.day, sh.slot, null);
  if (!r.ok) { setMsg(r.error); return; }
  applyPick(sh.day, sh.slot, r.week, false);
}
function applyPick(dayIdx, slot, week, openSides) {
  S.week = week; saveDraft();
  S.popped = { day: dayIdx, slot };
  closeSheet();
  renderAll();
  if (openSides) {
    setTimeout(() => { if (!S.sheet && !S.setupOpen) openSheet(dayIdx, 0); }, reduced() ? 0 : 360);
  }
  const mon = week.monday;
  if (isCelebration(week) && !S.celebrated[mon]) {
    S.celebrated[mon] = true; store.set('celebrated', S.celebrated);
    setTimeout(() => celebrate(false), reduced() ? 0 : 420);
  }
}

// ---------- celebration ----------
let celeTimer = null;
function celebrate(hold) {
  const el = $('#cele');
  if (!el) return;
  const n = S.week.days.filter((d) => d && d.main).length;
  const colors = ['#C4553D', '#F5EEDF', '#BFB09A', '#C4553D', '#EBE0CB'];
  let bits = '';
  if (!reduced()) {
    for (let i = 0; i < 36; i++) {
      const a = (i * 137.5) * Math.PI / 180, d = 105 + (i * 37) % 120;
      bits += `<i class="bit" style="--i:${i};--x:${Math.round(Math.cos(a) * d)}px;--y:${Math.round(Math.sin(a) * d)}px;--r:${(i * 53) % 360}deg;background:${colors[i % 5]}"></i>`;
    }
  }
  el.innerHTML = `${bits}<div class="card"><span class="meta">Week of ${shortDate(S.week.monday)}</span><h2>A full week.</h2><p>${n} dinners, each with two sides.</p><span class="link">Tap to keep going</span></div>`;
  el.className = 'cele' + (hold ? ' hold' : '');
  el.hidden = false;
  if (!reduced()) { S.wave = true; renderRail(); S.wave = false; }
  clearTimeout(celeTimer);
  if (!hold) celeTimer = setTimeout(() => hideCele(false), reduced() ? 3000 : 2300);
}
function hideCele(instant) {
  const el = $('#cele');
  clearTimeout(celeTimer);
  if (!el || el.hidden) return;
  if (instant || reduced()) { el.hidden = true; return; }
  el.classList.add('out');
  setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 210);
}

// ---------- save, push, share ----------
function weekLines() {
  const lines = [];
  S.week.days.forEach((day, i) => {
    if (!day) return;
    const names = [day.main].concat(day.sides || []).filter(Boolean).map((id) => (item(id) ? item(id).name : null)).filter(Boolean);
    if (names.length) lines.push(`${DAYS[i]}: ${names.join(', ')}`);
  });
  return lines.join('\n');
}
const currentLink = () => weekLink(pageAddress(), S.week);

function openResult(state, extra) {
  S.sheet = { kind: 'result' };
  S.result = Object.assign({ state }, extra || {});
  const r = S.result, him = himName();
  const head = $('#sheetHead'), body = $('#sheetBody');
  setMsg('');
  let title, text = '', buttons = '';
  if (state === 'sending') {
    title = r.updated ? 'Updating the list…' : 'Sending the list…';
    text = r.note ? '' : '<p>Your week is saved on this phone.</p>';
  } else if (state === 'sent') {
    title = r.updated ? 'Updated.' : 'Sent.';
    text = `<p>${r.updated ? 'The new list is' : 'The list is'} on ${him ? esc(him) + '’s' : 'the cook’s'} phone. Tap the notification there to open it.</p>`;
    buttons = '<button class="btn block" data-act="close">Done</button><button class="btn line block" data-act="copy">Copy link</button>';
  } else {
    title = r.note ? 'It didn’t send.' : 'Saved, but it didn’t send.';
    text = r.note ? '<p>Send the link another way before closing this page:</p>' : '<p>Your week is saved here and nothing is lost. Send the link another way:</p>';
    if (navigator.share) buttons += '<button class="btn block" data-act="share">Send by text</button>';
    buttons += `<button class="btn ${navigator.share ? 'line ' : ''}block" data-act="copy">Copy link</button><button class="btn line block" data-act="again">Try sending again</button>`;
  }
  head.innerHTML = `<div class="eyebrow"><span>Week of ${shortDate(S.week.monday)}</span><button class="linkbtn" data-act="close">Close</button></div><h2 id="sheetTitle">${title}</h2>`;
  body.innerHTML = `<div class="pad">${text}<div id="resultNote" class="note" role="status" aria-live="polite">${esc(r.note || '')}</div>${buttons}<div id="linkSlot"></div></div>`;
  showSheet();
}
// Every status line on the result sheet keeps the storage warning when the week could not be stored.
function resultNote(t, bad) {
  const n = $('#resultNote'); if (!n) return;
  const warn = S.result && S.result.note;
  n.textContent = warn ? `${t} ${warn}` : t;
  n.className = 'note' + (bad || warn ? ' bad' : '');
}

let saveSeq = 0;
async function save() {
  if (!canSave(S.week)) { openResultInfo('Pick a main first', 'Save week needs at least one night with a main.'); return; }
  if (!S.settings || !S.settings.channel) { S.setupOpen = true; route(); return; }
  const mon = S.week.monday, updated = !!S.saved[mon];
  S.saved[mon] = S.week;
  const kept = store.set('weeks', S.saved);
  delete S.drafts[mon]; store.set('drafts', S.drafts);
  S.hist = null;
  renderBar();
  const note = kept ? '' : 'This phone couldn’t store the week (storage is full or blocked), so it is only kept until you close the page.';
  const attempt = ++saveSeq;
  openResult('sending', { updated, note });
  const ok = FX ? false : await push(updated);
  if (attempt !== saveSeq) return; // a newer save or retry owns the sheet now
  if (S.sheet && S.sheet.kind === 'result') openResult(ok ? 'sent' : 'failed', { updated, note });
}
function openResultInfo(title, text) {
  S.sheet = { kind: 'result' };
  $('#sheetHead').innerHTML = `<div class="eyebrow"><span>Save week</span><button class="linkbtn" data-act="close">Close</button></div><h2 id="sheetTitle">${esc(title)}</h2>`;
  $('#sheetBody').innerHTML = `<div class="pad"><p>${esc(text)}</p><button class="btn block" data-act="close">OK</button></div>`;
  setMsg('');
  showSheet();
}
async function push(updated) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 10000);
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(S.settings.channel), {
      method: 'POST',
      body: weekLines(),
      headers: { 'Title': updated ? "This week's dinners (updated)" : "This week's dinners", 'Click': currentLink(), 'Tags': 'fork_and_knife' },
      signal: ctl ? ctl.signal : undefined,
    });
    clearTimeout(timer);
    return r.ok;
  } catch (e) { clearTimeout(timer); return false; }
}
// Share messages only claim the week is stored when it was (resultNote adds the warning otherwise).
const keptLine = () => (S.result && S.result.note) ? '' : ' Your week is still saved here.';
async function share() {
  if (!navigator.share) { resultNote('Sharing is not available on this phone. Use Copy link.', true); return; }
  try {
    await navigator.share({ title: "This week's dinners", text: weekLines(), url: currentLink() });
    resultNote('Shared. Check that the message went out.' + keptLine());
  } catch (e) {
    if (e && e.name === 'AbortError') resultNote('Cancelled. Nothing was sent.' + keptLine(), true);
    else resultNote('Sharing didn’t work. Nothing was sent.' + keptLine() + ' Try Copy link.', true);
  }
}
async function copyLink() {
  const link = currentLink();
  try { await navigator.clipboard.writeText(link); resultNote('Link copied.'); return; } catch (e) { /* try the older way */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = link; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) { resultNote('Link copied.'); return; }
  } catch (e) { /* show the link below */ }
  resultNote('Couldn’t copy by itself. Press and hold the link below, then Copy.', true);
  const slot = $('#linkSlot');
  if (slot) { slot.innerHTML = `<input class="linkbox" readonly value="${esc(link)}" aria-label="Link">`; const i = slot.querySelector('input'); i.focus(); i.select(); }
}

// ---------- Store list view ----------
function renderList(app, hash) {
  const dec = decodeWeek(hash);
  if (!dec.ok) {
    app.innerHTML = `<div class="err-page"><div class="eyebrow"><span>Store list</span></div><h1>This link looks <em>damaged</em></h1>
      <p>It may have been cut off when it was sent. Ask for the week to be saved again and open the new link.</p>
      <a class="btn line" href=".">Open the week builder</a></div>`;
    return;
  }
  const week = dec.week, mon = week.monday;
  const list = buildStoreList(week, MEALS);
  const ticks = new Set(store.get('ticks.' + mon, []));
  const keyOf = (aisle, l) => `${aisle}|${l.name.toLowerCase()}|${l.unit.toLowerCase()}`;
  const all = [];
  list.forEach((g) => g.items.forEach((l) => all.push(keyOf(g.aisle, l))));
  const total = all.length, got = all.filter((k) => ticks.has(k)).length;
  const planned = week.days.filter((d) => d && dayCount(d)).length;
  const fmtQty = (l) => (l.unit === 'each' ? String(l.amount) : `${l.amount} ${l.unit}`);
  const names = (arr) => arr.map((i) => DAYS[i]).join(' · ');

  let h = `<div class="eyebrow"><span>Week of ${shortDate(mon)}</span></div><h1>Store <em>list</em></h1>`;
  if (!total) {
    h += `<p class="sub">Nothing to buy: no dinners are planned this week.</p>`;
  } else {
    h += `<div class="bigcount" aria-live="polite"><div><b>${got}</b><span class="of">of ${total}</span></div><div class="lbl">in the<br>cart</div></div>
      <div class="bar"><i style="width:${total ? Math.round(got / total * 100) : 0}%"></i></div>
      <p class="sub">${total} items for ${planned} ${planned === 1 ? 'dinner' : 'dinners'}. Tick things as they go in the cart.</p>`;
  }
  list.forEach((g) => {
    const gGot = g.items.filter((l) => ticks.has(keyOf(g.aisle, l))).length;
    h += `<div class="aisle"><h2>${esc(g.aisle)}<span>${gGot} of ${g.items.length}</span></h2>`;
    g.items.forEach((l) => {
      const k = keyOf(g.aisle, l), done = ticks.has(k);
      h += `<button class="it${done ? ' done' : ''}" data-act="tick" data-key="${esc(k)}" role="checkbox" aria-checked="${done}"><span class="cb"></span><span class="nm">${esc(l.name)}</span><span class="qty">${esc(fmtQty(l))}</span><span class="dy">${names(l.days)}</span></button>`;
    });
    h += '</div>';
  });

  h += `<section class="cook"><div class="eyebrow"><span>Tap a night</span></div><h2>Cooking <em>day by day</em></h2><div class="cookwrap">`;
  week.days.forEach((day, i) => {
    if (!day || !dayCount(day)) return;
    const main = day.main ? item(day.main) : null;
    const open = S.openDay === i;
    const title = main ? main.name : 'Sides only';
    if (!open) {
      h += `<button class="dayrow" data-act="toggleday" data-day="${i}" aria-expanded="false"><span class="a"><i>${DAYS[i]}</i>${esc(title)}</span><span class="b">+</span></button>`;
      return;
    }
    const sides = (day.sides || []).filter(Boolean).map(item);
    const sideNames = sides.map((s) => (s ? s.name : 'an item that is no longer in the list'));
    const mins = dayMinutes(day);
    h += `<div class="dayopen"><button class="dayrow" data-act="toggleday" data-day="${i}" aria-expanded="true"><span class="a"><i>${DAYS[i]}</i>${esc(title)}</span><span class="b">−</span></button>`;
    if (sideNames.length) h += `<div class="pairs">With ${esc(sideNames.join(' and '))}.</div>`;
    h += `<div class="needs"><b>Time</b>${mins > 30 ? 'about ' : ''}${mins} min start to finish</div>`;
    const dayList = buildStoreList({ v: 1, monday: mon, days: week.days.map((d, di) => (di === i ? d : null)) }, MEALS);
    const needs = [];
    dayList.forEach((g) => g.items.forEach((l) => needs.push(`${l.name} (${fmtQty(l)})`)));
    if (needs.length) h += `<div class="needs"><b>Needs</b>${esc(needs.join(', '))}</div>`;
    [day.main].concat(day.sides || []).filter(Boolean).forEach((id) => {
      const it = item(id);
      if (!it) { h += `<div class="dish"><h3>An item that is no longer in the list</h3></div>`; return; }
      h += `<div class="dish"><h3>${esc(it.name)}</h3><div class="meta">${esc(metaLine(it))}</div>`;
      if (it.cookidoo && it.cookidoo.url) {
        h += `<a class="cdo" href="${esc(it.cookidoo.url)}" target="_blank" rel="noopener noreferrer">Open in Cookidoo</a>`;
      } else if (it.appliance === 'thermomix' && (!it.steps || !it.steps.length)) {
        h += `<p class="needs">Made in the Thermomix. Find the recipe in Cookidoo.</p>`;
      }
      if (it.steps && it.steps.length) h += `<ol class="steps">${it.steps.map((s) => `<li><span>${esc(s)}</span></li>`).join('')}</ol>`;
      h += '</div>';
    });
    h += '</div>';
  });
  h += `</div></section><div class="foot"><a href=".">Open the week builder</a>${FX ? '<div class="sample" style="margin-top:14px">Sample data · assumed</div>' : ''}</div>`;
  app.innerHTML = h;
  S.list = { mon, ticks, hash };
}

function tick(key) {
  const j = S.list; if (!j) return;
  if (j.ticks.has(key)) j.ticks.delete(key); else j.ticks.add(key);
  store.set('ticks.' + j.mon, Array.from(j.ticks));
  const y = window.scrollY;
  renderList($('#app'), j.hash);
  window.scrollTo(0, y);
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const cele = e.target.closest('#cele');
  if (cele) { hideCele(false); return; }
  if (e.target.id === 'scrim') { closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'tab': S.which = el.dataset.which; S.hist = null; loadWeek(); renderAll(); window.scrollTo(0, 0); break;
    case 'settings': S.setupOpen = true; route(); window.scrollTo(0, 0); break;
    case 'setup-cancel': S.setupOpen = false; route(); break;
    case 'rail': { const d = $('#day-' + el.dataset.day); if (d) d.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); break; }
    case 'slot': openSheet(Number(el.dataset.day), el.dataset.slot === 'main' ? 'main' : Number(el.dataset.slot)); break;
    case 'close': closeSheet(); break;
    case 'choose': choose(el.dataset.id); break;
    case 'remove': removePick(); break;
    case 'save': save(); break;
    case 'again': { const upd = !!(S.result && S.result.updated), note = (S.result && S.result.note) || '', attempt = ++saveSeq; openResult('sending', { updated: upd, note }); push(upd).then((ok) => { if (attempt === saveSeq && S.sheet && S.sheet.kind === 'result') openResult(ok ? 'sent' : 'failed', { updated: upd, note }); }); break; }
    case 'share': share(); break;
    case 'copy': copyLink(); break;
    case 'tick': tick(el.dataset.key); break;
    case 'toggleday': { const d = Number(el.dataset.day); S.openDay = S.openDay === d ? null : d; const y = window.scrollY; renderList($('#app'), S.list.hash); window.scrollTo(0, y); break; }
    default: break;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.sheet) closeSheet(); else hideCele(false); } });

route();
})();

</script>
