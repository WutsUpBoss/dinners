<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dinners</title>
<meta name="theme-color" content="#FAF9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinners">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:wght@400..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Dinners version 2, Look 3: near-white page, ink and plum, light Bricolage type, hairlines. Nothing under 16px.
   Every animation is 600 ms or less including its delay, none loops, and none runs under Reduce Motion. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bog:#1E1A16; --lime:#EDE8DE; --orchil:#5B2E56; --orchil-l:#944B8C; --muted:#756E65; --paper:#FAF9F6; --hair:rgba(30,26,22,.16);
  --disp:'Bricolage Grotesque',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
}
html{background:var(--lime);-webkit-text-size-adjust:100%}
html.locked,html.locked body{height:100%;overflow:hidden}
body{font:400 16px/1.4 var(--sans);color:var(--bog);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto;background:var(--paper);min-height:100vh;min-height:100dvh;position:relative;padding:calc(10px + env(safe-area-inset-top)) 20px 0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;text-align:left;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--orchil);outline-offset:2px}
em{font-style:italic}
ul,ol{list-style:none}
[hidden]{display:none!important}

/* top row */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.brand{display:flex;gap:8px;align-items:center;font:700 19px var(--disp);color:var(--orchil);letter-spacing:-.01em}
.here{display:flex;align-items:center;gap:9px;background:var(--lime);border-radius:99px;padding:6px 14px 6px 12px;font:500 16px var(--sans)}
.here.off{background:none;color:var(--muted);padding-right:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orchil-l)}
.dot.hollow{background:none;border:1.5px solid var(--muted)}
.warn{margin:12px 0 0;background:var(--bog);color:var(--paper);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center}
.warn b{display:block;font:600 18px var(--disp)}
.warn span{display:block;font-size:16px;color:var(--lime);opacity:.85;margin-top:1px}
.warn svg{flex:none}
h1{font:300 48px/1 var(--disp);letter-spacing:-.03em;padding:16px 0 0}
h1 em{color:var(--orchil)}
.rule{margin:14px 0 0;border-top:3px double var(--bog)}
.sub{font-size:18px;color:var(--muted);margin-top:8px}

/* week */
.wtabs{display:flex;gap:8px;margin:12px 0 2px}
.wtabs button{min-height:44px;padding:0 16px;border-radius:22px;font:600 16px var(--sans);color:var(--muted);border:1.5px solid var(--hair)}
.wtabs button[aria-pressed="true"]{color:var(--orchil);border-color:var(--orchil)}
.week{margin:0;padding-bottom:132px}
.week li{position:relative;display:grid;grid-template-columns:1fr 44px;align-items:center;border-bottom:1px solid var(--hair);min-height:64px}
.night{display:grid;grid-template-columns:54px 1fr;align-items:center;width:100%;padding:11px 0;min-height:64px;transition:background-color 90ms}
.night:active{background:var(--lime)}
.day{display:flex;flex-direction:column;font:600 17px/1.1 var(--disp)}
.day i{font:400 16px var(--mono);font-style:normal;color:var(--muted);margin-top:2px}
.body{display:block;min-width:0}
.nm{display:block;font:500 21px/1.15 var(--disp);letter-spacing:-.01em}
.sd{display:block;font-size:16px;line-height:1.3;color:var(--muted);margin-top:3px}
.sd.add{color:var(--orchil)}
.sd.long{color:var(--orchil);font-weight:500}
.new{font:600 16px var(--sans);color:var(--orchil);background:var(--lime);border-radius:99px;padding:0 9px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.end{display:flex;justify-content:flex-end;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 16px var(--sans);font-style:normal;flex:none}
.av.j{background:var(--bog);color:var(--paper)}
.av.l{background:var(--orchil);color:#fff}
.av.pend{background:var(--paper);color:var(--bog);border:2px dashed var(--bog)}
.week li.next::before{content:"";position:absolute;left:-20px;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--orchil)}
.week li.next .nm{font-size:22px;font-weight:600;color:var(--orchil)}
.week li.next .day{color:var(--orchil)}
.week li.soft{background:linear-gradient(90deg,var(--lime),rgba(237,232,222,.35));margin:0 -20px;padding:0 20px;grid-template-columns:1fr 50px}
.soft .nm{color:var(--muted);display:flex;align-items:center;gap:9px}
.soft .nm svg{flex:none}
.plus{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--orchil);display:grid;place-items:center;color:var(--orchil)}
.wait{display:block;width:100%;height:32px;border-radius:6px;border:1.5px dashed rgba(30,26,22,.22)}
.swapbtn{width:44px;height:44px;display:grid;place-items:center}
.swap{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center;color:var(--orchil);background:var(--paper)}
.swapbtn:active .swap{background:var(--orchil);color:var(--paper);border-color:var(--orchil)}
.note{display:flex;gap:7px;align-items:center;color:var(--orchil);font:500 16px/1.25 var(--sans);margin-top:5px}
.note svg{flex:none}
.week li.flash{background:rgba(148,75,140,.16)}
.deck{position:absolute;right:20px;top:108px;width:44px;height:60px}
.deck .back{position:absolute;inset:0}
.back{background:radial-gradient(circle at 50% 50%,transparent 0 9px,var(--orchil) 9px 10.5px,transparent 10.5px 15px,var(--orchil-l) 15px 16px,transparent 16px),var(--lime);border:1.5px solid var(--orchil);border-radius:8px;box-shadow:inset 0 0 0 3px var(--lime),inset 0 0 0 4px rgba(91,46,86,.35),0 8px 18px -8px rgba(30,26,22,.45)}
.flipback{position:absolute;left:54px;right:0;top:5px;bottom:5px;opacity:0;z-index:3;pointer-events:none}

/* bottom bar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;z-index:6;background:var(--paper);border-top:1px solid var(--hair);display:flex;align-items:center;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));min-height:86px}
.cnt{font:600 20px/1 var(--disp);flex:1;white-space:nowrap;color:var(--bog)}
.cnt small{font:400 16px var(--sans);color:var(--muted);display:block;margin-top:5px}
.btn{height:46px;border-radius:23px;padding:0 20px;display:inline-grid;place-items:center;font:600 17px var(--sans);white-space:nowrap;text-align:center;transition:opacity 150ms}
.btn.o{border:1.5px solid var(--orchil);color:var(--orchil)}
.btn.f{background:var(--bog);color:var(--paper)}
.btn.p{background:var(--orchil);color:#fff}
.btn.wide{flex:1}
.btn.dis{opacity:.4}
.btn.dis{padding:0 14px;font-size:16px}
.btn:active:not(.dis){opacity:.8}
.btn.big{height:56px;border-radius:28px;font-size:18px}

/* scrim, night menu and the pick sheet */
.scrim{position:fixed;inset:0;background:rgba(30,26,22,.42);opacity:0;transition:opacity 200ms;z-index:20}
.scrim.open{opacity:1}
.menu,.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;width:100%;background:var(--paper);border-radius:30px 30px 0 0;box-shadow:0 -10px 40px rgba(30,26,22,.18);z-index:21;transform:translateY(105%);transition:transform 260ms var(--ease)}
.menu.open,.sheet.open{transform:translateY(0)}
.menu{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.sheet{display:flex;flex-direction:column}
.grab{width:40px;height:5px;border-radius:3px;background:var(--hair);margin:10px auto 0;flex:none}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 0;font:600 17px var(--disp);min-height:52px}
.linkb{color:var(--orchil);font:600 17px var(--sans);min-height:48px;padding:0 0 0 18px}
.backb{width:48px;height:48px;margin-left:-12px;display:grid;place-items:center;color:var(--bog)}
.backb:disabled{visibility:hidden}
.mlist{margin:6px 20px 0}
.mrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;width:100%;min-height:68px;border-bottom:1px solid var(--hair)}
.mlist li:last-child .mrow{border-bottom:0}
.mrow .mi{color:var(--orchil)}
.mrow .nm{font-size:23px}
.mrow .tag{color:var(--muted);display:flex}
.mrow.dis{opacity:.4}
.mrow:active:not(.dis){background:var(--lime)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 20px 0;flex:none}
.slot{height:96px;border-radius:14px;background:var(--lime);padding:10px 11px;display:flex;flex-direction:column;position:relative;border:1.5px solid transparent}
.slot small{font:500 16px var(--sans);color:var(--muted)}
.slot .n{font:500 18px/1.08 var(--disp);letter-spacing:-.01em;margin-top:auto;overflow:hidden}
.slot .ok{position:absolute;right:9px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--bog);color:var(--paper);display:grid;place-items:center}
.slot.open{background:none;border:1.5px dashed var(--orchil)}
.slot.open small{color:var(--orchil)}
.slot.open .n{color:var(--orchil);display:grid;place-items:end start}
.slot.cur{border:1.5px solid var(--orchil)}
.slot.flash{box-shadow:inset 0 0 0 100px rgba(148,75,140,.22)}
.slot.open.cur{border-style:dashed}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;margin-top:4px}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform 260ms var(--ease),opacity 260ms ease}
.pane.from-r{transform:translateX(56px);opacity:0}
.pane.from-l{transform:translateX(-56px);opacity:0}
.pane.to-l{transform:translateX(-56px);opacity:0;pointer-events:none}
.pane.to-r{transform:translateX(56px);opacity:0;pointer-events:none}
.pane h2{flex:none;font:300 38px/1.05 var(--disp);letter-spacing:-.025em;padding:10px 20px 4px}
.pl{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.msg{position:absolute;left:20px;right:20px;bottom:16px;z-index:2;pointer-events:none;font-size:16px;color:var(--paper);font-weight:600}
.msg:not(:empty){background:var(--bog);padding:10px 14px;border-radius:12px}
.sect{margin:20px 0 2px}
.sect h3{font:500 16px var(--sans);color:var(--muted)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:calc(100% + 40px);margin:0 -20px;padding:0 20px;min-height:62px;border-bottom:1px solid var(--hair)}
.plist li{border-radius:12px}
.prow:active:not(.taken){background:var(--lime)}
.prow.sel{background:var(--lime);border-radius:12px;border-bottom-color:transparent}
.prow .nm{font-size:22px;flex:1;min-width:0}
.prow .tag{font:400 16px var(--mono);color:var(--muted);text-align:right;max-width:46%}
.prow.sel .tag{color:var(--bog)}
.tag .fresh{color:var(--orchil);font-weight:500}
.ck{display:none;width:26px;height:26px;border-radius:50%;background:var(--bog);place-items:center;color:var(--paper);flex:none}
.prow.sel .ck{display:grid}
.prow.quiet{min-height:56px}
.prow.quiet .nm{font:500 17px var(--sans);color:var(--muted)}
.prow.taken{opacity:.45}

/* the plum moment */
.moment{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;max-width:460px;margin:0 auto}
.panel{position:relative;height:420px;background:var(--orchil);border-radius:0 0 40px 40px;overflow:hidden;color:var(--lime)}
.fan{position:relative;height:300px;margin-top:40px}
.fan .c{position:absolute;left:50%;top:50px;width:124px;height:178px;margin-left:-62px;border-radius:18px;background:var(--paper);color:var(--bog);padding:12px 13px;transform-origin:50% 100%;box-shadow:0 14px 24px -10px rgba(0,0,0,.6)}
.fan .c:nth-child(odd){background:var(--lime)}
.fan .c .d{font:600 25px var(--disp);letter-spacing:-.02em}
.fan .c .nm{font:500 18px/1.1 var(--disp);margin-top:8px;color:var(--bog)}
.fan .c .av{position:absolute;left:13px;bottom:13px}
.conf{position:absolute;z-index:4}
.center{text-align:center}
.hd{font:300 46px/1.02 var(--disp);letter-spacing:-.03em;margin-top:28px}
.moment .sub{margin-top:8px}
.tally{display:flex;justify-content:center;gap:22px;margin-top:20px;font:500 17px var(--sans);color:var(--muted)}
.tally span{display:flex;gap:8px;align-items:center}
.tally .av{width:28px;height:28px}
.actions{display:flex;flex-direction:column;gap:12px;padding:24px 20px 0}
.actions .btn{height:56px;border-radius:28px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:18px}
.actions .btn em{font-style:normal}
.qlink{text-align:center;font:600 18px var(--sans);color:var(--muted);min-height:48px;width:100%}
.mnote{margin:14px 20px 0;font-size:16px;line-height:1.4;color:var(--muted);text-align:center}
.mnote:empty{display:none}
.mnote.bad{color:var(--orchil);font-weight:600}
.mdone{padding:22px 20px calc(30px + env(safe-area-inset-bottom))}
.mdone .btn{display:grid;width:100%}
.linkbox{display:block;width:calc(100% - 40px);margin:10px 20px 0;font:500 16px var(--mono);padding:12px;border:1.5px solid var(--bog);background:#fff;border-radius:12px}

/* setup */
.setup{flex:1;display:flex;flex-direction:column;position:relative}
.seticon{padding:22px 0 0}
.seticon svg{display:block;border-radius:14px}
.prog{display:flex;gap:6px;padding:18px 0 0}
.prog b{flex:1;height:4px;border-radius:2px;background:var(--lime)}
.prog b.d{background:var(--bog)}
.prog b.n{background:var(--orchil-l)}
.sh2{font:300 46px/1.04 var(--disp);letter-spacing:-.03em;padding:18px 0 0;text-wrap:balance}
.field{margin-top:30px;height:68px;border-radius:16px;background:var(--lime);border:1.5px solid var(--hair);display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;font-size:19px;gap:10px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 17px var(--mono);color:var(--bog)}
.field input::placeholder{color:var(--muted);font:400 19px var(--sans)}
.field.bad{border:2px solid var(--orchil);background:var(--paper)}
.pastebtn{font:600 17px var(--sans);color:var(--orchil);border:1.5px solid var(--orchil);border-radius:99px;height:44px;padding:0 16px;display:grid;place-items:center;flex:none}
.err{margin:14px 2px 0;color:var(--orchil);display:flex;gap:9px;align-items:flex-start;font:500 18px/1.3 var(--sans)}
.err:empty{display:none}
.err svg{flex:none;margin-top:1px}
.bigbtn{position:absolute;left:0;right:0;bottom:44px;height:56px;border-radius:28px;background:var(--bog);color:var(--paper);display:grid;place-items:center;text-align:center;font:600 18px var(--sans)}
.bigbtn.off{background:var(--lime);color:var(--muted)}
.setup{min-height:calc(100dvh - 20px)}
.tiles{display:flex;flex-direction:column;gap:14px;padding:30px 0 0}
.tile{height:200px;border-radius:28px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;width:100%}
.tile span{font:300 58px/1 var(--disp);letter-spacing:-.03em}
.tile .av{width:46px;height:46px;font-size:20px}
.tile.j{background:var(--bog);color:var(--paper)}
.tile.j .av{background:var(--paper);color:var(--bog)}
.tile.l{background:var(--orchil);color:#fff}
.tile.l .av{background:var(--paper);color:var(--orchil)}

/* Jason's list */
.ltop .wk{font:400 16px var(--mono);color:var(--muted)}
.lh1{margin:8px 0 0;padding:0}
.err-page{padding-top:20px}
.err-page p{font-size:18px;line-height:1.45;margin:6px 0 20px}
.bigcount{display:flex;align-items:baseline;gap:10px;margin-top:20px}
.bn{display:block;white-space:nowrap}
.bigcount b{font:300 108px/.9 var(--disp);letter-spacing:-.04em;color:var(--orchil)}
.bigcount .of{font:300 40px var(--disp);color:var(--muted);white-space:nowrap;margin-left:10px}
.bigcount .lbl{font:400 18px/1.2 var(--sans);color:var(--bog);margin-left:6px}
.meter{height:6px;border-radius:3px;background:var(--lime);margin-top:18px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--orchil);border-radius:3px}
.aisle{margin-top:30px}
.aisle h2{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--bog);padding-bottom:8px;font:600 24px var(--disp);letter-spacing:-.01em}
.aisle h2 span{font:400 16px var(--mono);color:var(--muted)}
.it{display:grid;grid-template-columns:42px 1fr auto;align-items:center;width:100%;min-height:58px;border-bottom:1px solid var(--hair);transition:background-color 90ms}
.it:active{background:var(--lime)}
.cb{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(30,26,22,.4);display:grid;place-items:center;color:var(--paper)}
.it .nm{font:500 20px var(--disp)}
.it .qty{font:400 16px var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.it.done .cb{background:var(--bog);border-color:var(--bog)}
.it.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.cook{margin-top:44px}
.cook h2{font:300 40px/1.05 var(--disp);letter-spacing:-.025em;margin:0 0 12px}
.cookwrap{border-top:3px double var(--bog)}
.dayrow{display:grid;grid-template-columns:54px 1fr auto;align-items:center;width:100%;padding:12px 0;min-height:70px;border-bottom:1px solid var(--hair);text-align:left}
button.dayrow:active{background:var(--lime)}
.dayrow .dd{font:600 17px var(--disp);color:var(--bog)}
.dayrow .a{display:flex;align-items:center;gap:9px;font:500 21px/1.15 var(--disp);letter-spacing:-.01em}
.dayrow .a.eo{color:var(--muted)}
.dayrow .a svg{flex:none}
.dayrow .w{display:block;margin-top:3px;font-size:16px;line-height:1.3;color:var(--muted)}
.dayrow .b{color:var(--muted);font:500 26px/1 var(--sans);width:34px;text-align:center}
.dayrow.out{background:linear-gradient(90deg,var(--lime),rgba(237,232,222,.35));margin:0 -20px;padding:12px 20px;width:calc(100% + 40px)}
.dayopen{background:var(--lime);margin:0 -20px;padding:0 20px 22px;border-radius:16px;border-bottom:1px solid var(--hair)}
.dayopen .dayrow{border:0;width:100%}
.dayopen .dayrow .a{color:var(--orchil);font-weight:600}
.dayopen .dayrow .b{color:var(--orchil)}
.long{font-size:16px;color:var(--orchil);font-weight:500;margin:-6px 0 6px 54px}
.needs{font-size:16px;line-height:1.5;color:var(--muted);padding:2px 0 14px}
.dish{border-top:1px solid var(--hair);padding:16px 0 6px}
.dish h3{font:600 23px var(--disp);letter-spacing:-.01em}
.dish .q{font:400 16px var(--mono);color:var(--muted);margin:3px 0 8px}
.steps{counter-reset:s;margin-top:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;padding:8px 0;font-size:17px;line-height:1.4}
.steps li::before{content:counter(s);font:300 26px/1 var(--disp);color:var(--orchil)}
.cdo{display:inline-flex;align-items:center;margin-top:12px;height:48px;border-radius:24px;border:1.5px solid var(--orchil);color:var(--orchil);padding:0 20px;font:600 17px var(--sans);text-decoration:none}
.foot{padding:26px 0 40px;font-size:16px;color:var(--muted)}
.sample{font:500 16px/1.2 var(--sans);color:var(--muted);margin-top:14px}
.btn.o.link{display:inline-grid}
.err-page .btn{display:inline-grid;text-decoration:none}

/* motion: only when the phone allows it; every item is 600 ms or less including its delay, nothing loops */
@media (prefers-reduced-motion:no-preference){
  .land{animation:land .36s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
  @keyframes land{from{opacity:0;transform:translateY(-16px) rotate(-1.5deg)}to{opacity:1;transform:none}}
  .land .flipback{animation:flipaway .42s cubic-bezier(.25,.8,.3,1) both;animation-delay:calc(var(--i,0)*60ms)}
  @keyframes flipaway{0%{opacity:1;transform:translate(150px,-210px) rotate(14deg) scale(.45)}55%{opacity:1;transform:none}100%{opacity:0;transform:perspective(500px) rotateX(88deg)}}
  .land>:not(.flipback){animation:reveal .42s ease-out both;animation-delay:calc(var(--i,0)*60ms)}
  @keyframes reveal{0%,52%{opacity:0}100%{opacity:1}}
  .week li.flash{animation:flash .6s ease-out both}
  .slot.flash{animation:slotflash .6s ease-out both}
  @keyframes slotflash{from{box-shadow:inset 0 0 0 100px rgba(148,75,140,.4)}to{box-shadow:inset 0 0 0 100px rgba(148,75,140,0)}}
  @keyframes flash{from{background:rgba(148,75,140,.32)}}
  .deck{animation:deckin .5s ease-out both}
  @keyframes deckin{from{transform:translateY(8px);opacity:0}}
  .slot .ok.pop{animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes pop{from{transform:scale(.4)}to{transform:none}}
  .moment.play .fanc{animation:fan .5s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i)*30ms)}
  @keyframes fan{from{opacity:0;transform:translateX(0) rotate(0deg) translateY(60px)}to{opacity:1;transform:translateX(var(--x)) rotate(var(--r))}}
  .moment.play .fall{animation:fall .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i)*5ms)}
  @keyframes fall{from{opacity:0;transform:translateY(-50px) rotate(0)}to{opacity:1;transform:rotate(var(--r,0))}}
  .field.bad{animation:shake .3s ease-out}
  @keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
  .tile:active{transform:scale(1.02);transition:transform 300ms}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
html.still *,html.still *::before,html.still *::after{animation:none!important}

function pad(n) { return String(n).padStart(2, '0'); }

function isoFromUTC(ms) {
  const d = new Date(ms);

function utcMs(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);

let builderOn = false;
let paintTimer = null;
let syncPromise = null;
let moveDone = false;
let otherPhone = null; // fixtures only: the other person's sync
let fxServer = null;

const lock = (key, ms) => { S[key] = Math.max(S[key], performance.now() + ms); };
const GLIDE = 260;

// ---------- display helpers ----------
const item = (id) => findItem(MEALS, id);
const dispName = (it) => (it ? it.name.replace(/ \(Thermomix\)$/, '') : 'A retired item');
function dateParts(iso) { const [y, m, d] = iso.split('-').map(Number); return { y, m, d }; }
function shortDate(iso) { const p = dateParts(iso); return MONTHS[p.m - 1] + ' ' + p.d; }
function rangeTitle(mon) {
  const a = dateParts(mon), b = dateParts(addDays(mon, 6));
  return a.m === b.m ? `${MONTHS[a.m - 1]} ${a.d}–${b.d}` : `${MONTHS[a.m - 1]} ${a.d}–${MONTHS[b.m - 1]} ${b.d}`;
}
function applianceName(it) { return it.appliance === 'oven' && it.ovenTempF ? `Oven ${it.ovenTempF}°F` : (APPL[it.appliance] || it.appliance); }
const PLURAL = { pack: 'packs', bag: 'bags', jar: 'jars', cup: 'cups', clove: 'cloves', can: 'cans', tub: 'tubs', crown: 'crowns', bunch: 'bunches', head: 'heads' };
function fmtQty(l) {
  if (l.unit === 'each') return String(l.amount);
  const u = l.amount > 1 && PLURAL[l.unit] ? PLURAL[l.unit] : l.unit;
  return `${l.amount} ${u}`;
}
const isHomeN = (n) => !!(n && n.st === 'h' && n.m);
const av = (by, cls) => `<i class="av ${by === 'J' ? 'j' : 'l'}${cls ? ' ' + cls : ''}" aria-label="${esc(NAMES[by] || '')}">${esc(by || '')}</i>`;
function mondayNow() { return S.which === 'this' ? thisMonday(now()) : comingMonday(now()); }

// v1-style helpers for the list view (days are { main, sides } | { out } | { away } | null)
function dayCount(day) { return day ? (day.main ? 1 : 0) + (day.sides || []).filter(Boolean).length : 0; }
function dayMinutes(day) { return day ? dinnerMinutes(day.main ? item(day.main) : null, (day.sides || []).map(item).filter(Boolean)) : 0; }
function withLine(day) {
  const names = (day && day.sides ? day.sides : []).filter(Boolean).map((id) => (item(id) ? item(id).name : 'a retired side'));
  return names.length ? 'with ' + names.join(' & ') : '';
}

// ---------- history (shared, from the live weeks) ----------
function history() {
  if (!S.hist) {
    const ids = MEALS.mains.concat(MEALS.sides).map((i) => i.id);
    const ws = sync ? sync.weeks().filter((w) => w.monday >= HISTORY_FROM) : [];
    const hw = historyWeeks(ws);
    S.hist = { last: lastHad(hw, todayISO(), ids), counts: pickCounts(hw, ids) };
  }
  return S.hist;
}
// "20 min · new" (never picked), "20 min · coming up" (picked, not had yet) or "20 min · 5 days ago"
function quietLine(it) {
  const h = history(), l = h.last[it.id] || { daysAgo: null, label: 'not yet' };
  if (l.daysAgo !== null) return `${it.minutes} min · ${esc(l.label)}`;
  const n = h.counts[it.id] || 0;
  return `${it.minutes} min · ${isNew(it, todayISO(), n) ? '<span class="fresh">new</span>' : (n > 0 ? 'coming up' : 'not yet')}`;
}
const avail = () => availableMeals(MEALS, todayISO());

// ---------- routing ----------
const getHash = () => (FX && FX.hash != null ? FX.hash : window.location.hash);
const pageAddress = () => (FX && FX.address) || window.location.href.split('#')[0];

function route() {
  const app = $('#app');
  closeAll(true);
  builderOn = false;
  const h = getHash();
  if (h.indexOf('#w=') === 0) return renderList(app, h);                // Jason's list: no setup, no household, no network
  if (!S.settings || !S.settings.key || !S.settings.me) return renderSetup(app);
  mountBuilder(app);
}
window.addEventListener('hashchange', () => { if (!FX) route(); });

// ---------- setup ----------
function setupIcon() { return `<div class="seticon">${mark(64)}</div>`; }
function renderSetup(app) {
  const st = S.setup;
  if (st.step === 'who') {
    app.innerHTML = `<div class="setup">${setupIcon()}<div class="prog"><b class="d"></b><b class="n"></b></div>
      <h2 class="sh2">Who's this phone?</h2>
      <div class="tiles"><button class="tile j" data-act="who" data-who="J"><i class="av j">J</i><span>Jason</span></button>
      <button class="tile l" data-act="who" data-who="L"><i class="av l">L</i><span>Laci</span></button></div></div>`;
    return;
  }
  app.innerHTML = `<div class="setup">${setupIcon()}<div class="prog"><b class="n"></b><b></b></div>
    <h2 class="sh2">Paste the invite code</h2>
    <div class="field${st.error ? ' bad' : ''}" id="field"><input id="code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Invite code" placeholder="Invite code" value="${esc(st.value)}"><button class="pastebtn" data-act="paste">Paste</button></div>
    <div class="err" id="codeErr" role="alert">${st.error ? IC.alert + esc(st.error) : ''}</div>
    <button class="bigbtn${st.value.trim() ? '' : ' off'}" id="codeGo" data-act="code-go">Continue</button></div>`;
}
function codeGo() {
  const input = $('#code');
  if (input) S.setup.value = input.value;
  if (!S.setup.value.trim()) return;
  const r = decodeInvite(S.setup.value);
  if (!r.ok) { S.setup.error = r.error; renderSetup($('#app')); return; }
  S.setup = { step: 'who', value: '', error: '', pending: { key: r.key, channel: r.channel } };
  renderSetup($('#app'));
}
function pickWho(me) {
  const p = S.setup.pending;
  if (!p || (me !== 'J' && me !== 'L')) return;
  S.settings = { key: p.key, channel: p.channel, me };
  if (!kv.set(V2 + 'settings', S.settings)) { /* kept in memory until the page closes; the week still works */ }
  S.setup = { step: 'code', value: '', error: '', pending: null };
  route();
}

// ---------- the week ----------
function mountBuilder(app) {
  builderOn = true;
  S.rows = [];
  S.hist = null;
  app.innerHTML = `<div class="top"><div class="brand">${brandMark()}<span>${esc(APP_NAME)}</span></div><div id="pill"></div></div>
    <div id="warn"></div>
    <div class="hrow"><h1 id="title"></h1></div><div class="rule"></div>
    <div class="wtabs" role="group" aria-label="Week" id="tabs"></div>
    <ol class="week" id="week"></ol>
    <div class="deck" id="deck" hidden><div class="back" style="transform:rotate(-3deg)"></div><div class="back" style="transform:translate(-2px,-2px) rotate(2deg)"></div><div class="back" style="transform:translate(-4px,-4px)"></div></div>
    <div class="bar" id="bar"></div>`;
  S.monday = mondayNow();
  startSync().then(() => { if (builderOn) { paint(); afterMount(); } });
}

function schedulePaint() {
  if (paintTimer) return;
  paintTimer = setTimeout(() => { paintTimer = null; S.hist = null; paint(); }, 0);
}

function paint() {
  if (!builderOn || !sync) return;
  S.monday = mondayNow();
  // The open pick sheet always shows the night as it is now, whatever brought the change (a remote or conflict event, the
  // first snapshot after an offline start recovers, a reconnect, any repaint). This phone's own picks update the key first.
  if (S.sheet && S.sheet.kind === 'flow' && S.sheetKey !== undefined && nightKey(curNight(S.sheet.day)) !== S.sheetKey && !S.sheetDirty) S.sheetDirty = {};
  if (S.sheetDirty) refreshOpenSheet();
  const view = sync.week(S.monday);
  paintHead(view);
  paintRows(view);
  paintBar(view);
}

// A change reports kept:true only when sync wrote the whole pending queue to this phone's storage. That is the only
// thing that clears "Not kept on this phone" (a tiny test write would say nothing about the queue).
function wrote(r) { if (r && r.kept === true) S.notKept = false; return r; }

function paintHead(view) {
  $('#title').textContent = rangeTitle(S.monday);
  $('#tabs').innerHTML = `<button data-act="tab" data-which="this" aria-pressed="${S.which === 'this'}">This week</button><button data-act="tab" data-which="coming" aria-pressed="${S.which === 'coming'}">Next week</button>`;
  const me = S.settings.me, them = other(me);
  let pill = '';
  if (!S.online) pill = '<div class="here off"><span class="dot hollow"></span>Offline</div>';
  else if (S.presence[them]) pill = `<div class="here"><span class="dot"></span>${esc(NAMES[them])} is here</div>`;
  $('#pill').innerHTML = pill;
  $('#warn').innerHTML = S.notKept ? `<div class="warn" role="alert">${IC.alertL}<div><b>Not kept on this phone</b><span>Save and send before you close this.</span></div></div>` : '';
}

function dealtNights(view) {
  if (S.dealtMon !== S.monday) return [];
  return Object.keys(S.dealOps).map(Number).filter((n) => view.nights[n] && view.nights[n].op === S.dealOps[n]);
}

function rowHTML(n, view, ctx) {
  const night = view.nights[n];
  const date = addDays(S.monday, n), dp = dateParts(date);
  const day = `<span class="day">${DAYS[n]}<i>${dp.d}</i></span>`;
  const key = `${S.monday}|${n}`;
  const refused = S.refused.has(key) ? `<span class="note">${IC.alert}Not saved. Tap to pick again.</span>` : '';
  const pend = night && night.at === 0;
  let cls = 'r', body, end = '', label;
  if (isHomeN(night)) {
    const main = item(night.m);
    const sides = [night.s0, night.s1].filter(Boolean);
    const it = main || null;
    const nw = main && isNew(main, todayISO(), history().counts[main.id] || 0) ? '<span class="new">new</span>' : '';
    const mins = dinnerMinutes(main, sides.map(item).filter(Boolean));
    const sideNames = sides.map((id) => dispName(item(id)));
    const hint = sides.length === 0 ? 'Add sides' : (sides.length === 1 ? 'Add a side' : '');
    body = `<span class="nm">${esc(dispName(it))}${nw}</span>`
      + (sideNames.length ? `<span class="sd">${esc(sideNames.join(', '))}</span>` : '')
      + (hint ? `<span class="sd add">${hint}</span>` : '')
      + (mins > 30 ? `<span class="sd long">about ${mins} min</span>` : '') + refused;
    label = `${DAYS_FULL[n]}, ${dispName(it)}${sideNames.length ? ', ' + sideNames.join(' and ') : ''}`;
    if (n === ctx.next) cls += ' next';
    end = ctx.dealt.includes(n)
      ? `<button class="swapbtn" data-act="swap" data-day="${n}" aria-label="Swap ${DAYS_FULL[n]}"><span class="swap">${IC.swap}</span></button>`
      : av(night.by, pend ? 'pend' : '');
  } else if (night && night.st === 'o') {
    cls += ' soft';
    body = `<span class="nm">${IC.eat}Eat out</span>${refused}`; label = `${DAYS_FULL[n]}, eat out`;
    end = av(night.by, pend ? 'pend' : '');
  } else if (night && night.st === 'a') {
    cls += ' soft';
    body = `<span class="nm">${IC.away}Jason away</span>${refused}`; label = `${DAYS_FULL[n]}, Jason away`;
    end = av(night.by, pend ? 'pend' : '');
  } else if (ctx.dealing && ctx.fillable.includes(n)) {
    body = '<span class="wait"></span>'; label = `${DAYS_FULL[n]}, dealing`;
  } else {
    body = refused ? refused : `<span class="plus">${IC.plus}</span>`; label = `${DAYS_FULL[n]}, add dinner`;
  }
  return `<li class="${cls}" data-n="${n}"><button class="night" data-act="night" data-day="${n}" aria-label="${esc(label)}">${day}<span class="body">${body}</span></button><span class="end">${end}</span></li>`;
}

function paintRows(view) {
  if (performance.now() < S.freezeUntil) { // cards are still flying in: leave the rows alone until they land
    clearTimeout(S.freezeTimer);
    S.freezeTimer = setTimeout(() => { S.freezeUntil = 0; paint(); }, Math.max(10, S.freezeUntil - performance.now() + 20));
    return;
  }
  const today = todayISO();
  let next = -1;
  for (let n = 0; n < 7; n++) if (isHomeN(view.nights[n]) && addDays(S.monday, n) >= today) { next = n; break; }
  const ctx = { next, dealt: dealtNights(view), dealing: S.dealing, fillable: [0, 1, 2, 3, 4, 5, 6].filter((n) => isEmptyNight(view.nights[n])) };
  const ol = $('#week');
  for (let n = 0; n < 7; n++) {
    const html = rowHTML(n, view, ctx);
    if (S.rows[n] === html && ol.children[n]) continue;
    S.rows[n] = html;
    const tmp = document.createElement('template');
    tmp.innerHTML = html.trim();
    const li = tmp.content.firstElementChild;
    if (ol.children[n]) ol.replaceChild(li, ol.children[n]); else ol.appendChild(li);
  }
  // soft flash on nights the other phone changed (or that lost a conflict)
  for (let n = 0; n < 7; n++) {
    const li = ol.children[n];
    if (li && !S.flash.has(`${S.monday}|${n}`)) li.classList.remove('flash');
  }
  for (const key of S.flash) {
    const [mon, n] = key.split('|');
    if (mon !== S.monday) continue;
    const li = ol.children[Number(n)];
    if (li) li.classList.add('flash');
  }
  const homes = view.nights.filter(isHomeN).length;
  const deck = $('#deck');
  deck.hidden = !(S.dealing || (homes === 0 && S.dealtMon !== S.monday && view.nights.every(isEmptyNight)));
  $('#title').textContent = S.dealing ? 'Dealing' : rangeTitle(S.monday);
}

function paintBar(view) {
  const homes = view.nights.filter(isHomeN).length;
  const dealt = dealtNights(view);
  const res = S.dealResult;
  const partial = !!(res && res.dealt < res.target && S.dealtMon === S.monday);
  const dealtMode = S.dealtMon === S.monday && (dealt.length > 0 || partial);
  const cnt = S.dealing ? 'Dealing' : (homes === 0 ? 'No dinners' : (homes === 1 ? '1 dinner' : `${homes} dinners`));
  const saved = view.saved && view.nights.every((x) => !x || x.at === undefined || (x.at !== 0 && x.at <= view.saved.at));
  const sub = !S.dealing && homes > 0 && saved ? '<small>Saved</small>' : '';
  const btn = (cls, act, text, dis) => `<button class="btn ${cls}${dis ? ' dis' : ''}" data-act="${act}"${dis ? ' aria-disabled="true"' : ''}>${text}</button>`;
  let btns;
  if (S.dealing) btns = btn('o', 'none', 'Deal again', true) + btn('f', 'none', 'Keep', true);
  else if (dealtMode) {
    btns = (partial ? btn('o', 'none', esc(`Dealt ${res.dealt} of ${res.target}`), true) : btn('o', 'deal-again', 'Deal again', !S.online))
      + btn('f', 'keep', 'Keep');
  } else {
    const label = dealLabel(view, { online: S.online });
    if (label === null) btns = btn('f wide', 'save', 'Save');
    else {
      const off = label === 'Deal needs signal';
      btns = homes === 0 ? btn('p wide', 'deal', esc(label), off) : btn('o', 'deal', esc(label), off) + btn('f', 'save', 'Save');
    }
  }
  $('#bar').innerHTML = `<div class="cnt">${cnt}${sub}</div>${btns}`;
}

// ---------- remote changes and events ----------
function onEvent(ev) {
  if (!ev) return;
  if (ev.type === 'remote' || ev.type === 'conflict') {
    const key = `${ev.monday}|${ev.n}`;
    S.flash.add(key);
    if (!(FX && FX.holdFlash)) setTimeout(() => { S.flash.delete(key); $$('#week li.flash').forEach((el) => el.classList.remove('flash')); }, 600);
    if (S.sheet && S.sheet.kind === 'flow' && ev.monday === S.monday && ev.n === S.sheet.day) S.sheetDirty = ev; // refreshed on the next paint, once the new night has arrived
  } else if (ev.type === 'refused') {
    S.refused.add(`${ev.monday}|${ev.n}`);
  } else if (ev.type === 'not-kept') {
    S.notKept = true;
  }
  S.hist = null;
  schedulePaint();
}

// ---------- the shared spot ----------
function withTimeout(promise, ms, fallback) {
  return new Promise((resolve) => {
    const t = setTimeout(() => resolve(fallback), ms);
    promise.then((v) => { clearTimeout(t); resolve(v); }, () => { clearTimeout(t); resolve(fallback); });
  });
}

// A store that is never connected: picks go to the durable queue and replay once a real store takes its place.
// It never delivers data, so the page does not wait for any.
function offlineStore() {
  const rej = () => Promise.reject(Object.assign(new Error('offline'), { code: 'offline' }));
  return { online: false, live: false, subscribe() { return () => {}; }, onConnection() { return () => {}; }, transact: rej, set: rej,
    onDisconnectSet: rej };
}

// The one store the sync layer talks to. It starts on the offline store and is switched to the real one when the
// Firebase code finally loads (late, or after a failed first try). Listeners and the in-memory queue stay where they
// are: only the store underneath changes, so nothing pending is lost or sent twice.
function switchableStore(initial) {
  let cur = initial;
  const subs = new Set();
  const conns = new Set();
  let reported = false;
  let unConn = null;
  const report = (on) => { if (on === reported) return; reported = on; for (const cb of [...conns]) cb(on); };
  const attach = () => { if (unConn) unConn(); unConn = cur.onConnection(report); };
  attach();
  return {
    get online() { return !!cur.online; },
    get live() { return cur.live !== false; },
    subscribe(path, cb) {
      const e = { path, cb, un: cur.subscribe(path, cb) };
      subs.add(e);
      return () => { subs.delete(e); try { e.un(); } catch (x) { /* gone */ } };
    },
    onConnection(cb) { conns.add(cb); return () => { conns.delete(cb); }; },
    transact: (...a) => cur.transact(...a),
    set: (...a) => cur.set(...a),
    onDisconnectSet: (...a) => (typeof cur.onDisconnectSet === 'function' ? cur.onDisconnectSet(...a) : Promise.reject(Object.assign(new Error('offline'), { code: 'offline' }))),
    close() { if (typeof cur.close === 'function') cur.close(); },
    swap(next) {
      const old = cur;
      cur = next;
      for (const e of subs) { try { e.un(); } catch (x) { /* gone */ } e.un = cur.subscribe(e.path, e.cb); }
      attach();
      report(!!cur.online);
      void old;
    },
  };
}

// The Firebase code, loaded from Google's servers. A failure is not remembered: the next call tries again.
let sdkPromise = null;
function loadSdk() {
  if (!sdkPromise) {
    sdkPromise = (async () => {
      try {
        const app = await import(SDK_URL + 'firebase-app.js');
        const dbm = await import(SDK_URL + 'firebase-database.js');
        return { app, dbm };
      } catch (e) { return null; }
    })().then((r) => { if (!r) sdkPromise = null; return r; });
  }
  return sdkPromise;
}
function buildFirebaseStore(sdk, key) {
  try {
    const { app, dbm } = sdk;
    const fbApp = app.initializeApp(FIREBASE_CONFIG);
    const db = dbm.getDatabase(fbApp, FIREBASE_CONFIG.databaseURL);
    return createFirebaseStore({
      sdk: { ref: dbm.ref, child: dbm.child, onValue: dbm.onValue, runTransaction: dbm.runTransaction, set: dbm.set,
        serverTimestamp: dbm.serverTimestamp, onDisconnect: dbm.onDisconnect, goOffline: dbm.goOffline },
      db, root: 'households/' + key,
    });
  } catch (e) { return null; }
}

// Keeps trying to reach the shared spot until it is there: when the phone says it is online again, when the app comes
// back to the front, and on a backoff (3 s, 6 s, ... up to a minute). A first load that only finishes late switches too.
let realStore = false;
let retryN = 0;
let retryTimer = null;
function upgradeSoon(ms) {
  if (realStore || FX) return;
  clearTimeout(retryTimer);
  retryTimer = setTimeout(tryUpgrade, ms);
}
async function tryUpgrade() {
  if (realStore || FX || !store || !S.settings) return;
  const sdk = await loadSdk();
  if (realStore) return;
  const real = sdk ? buildFirebaseStore(sdk, S.settings.key) : null;
  if (!real) { retryN = Math.min(retryN + 1, 5); upgradeSoon(Math.min(60000, 3000 * 2 ** (retryN - 1))); return; }
  realStore = true;
  clearTimeout(retryTimer);
  store.swap(real);
}
if (!FX) {
  window.addEventListener('online', () => { retryN = 0; tryUpgrade(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tryUpgrade(); });
}

function startSync() {
  if (syncPromise) return syncPromise;
  syncPromise = (async () => {
    const me = S.settings.me;
    if (FX) {
      fxServer = createServer({ clock: () => now().getTime() });
      store = fxServer.client('phone-' + me);
    } else {
      // Give the Firebase code a few seconds. If it is not here by then, open offline and keep trying (a late load
      // still switches over, see tryUpgrade).
      const sdk = await withTimeout(loadSdk(), SDK_WAIT_MS, null);
      const real = sdk ? buildFirebaseStore(sdk, S.settings.key) : null;
      realStore = !!real;
      store = switchableStore(real || offlineStore());
    }
    const rng = FX ? mulberry32(FX.rngSeed || 7) : Math.random;
    sync = createSync({ store, storage: syncStorage, me, now: () => now().getTime(), onEvent, rng });
    await sync.start();
    let firstData;
    const first = new Promise((r) => { firstData = r; });
    store.subscribe('weeks', () => { firstData(); schedulePaint(); });
    store.subscribe('presence', () => { S.presence = sync.presence(); schedulePaint(); });
    store.onConnection(onConn);
    if (FX || store.live) await withTimeout(first, FIRST_DATA_MS, null);
    onConn(!!store.online);
    if (FX) { await runFixture(FX.seed || []); S.flash.clear(); S.refused.clear(); schedulePaint(); }
    else if (!realStore) tryUpgrade();
    document.addEventListener('visibilitychange', () => { if (sync && S.online) sync.setPresence(document.visibilityState !== 'hidden'); });
    window.addEventListener('pagehide', () => { if (sync && S.online) sync.setPresence(false); });
  })();
  return syncPromise;
}

async function onConn(on) {
  S.online = !!on;
  S.presence = sync ? sync.presence() : S.presence;
  schedulePaint();
  if (!on || !sync) return;
  const me = S.settings.me;
  try { if (typeof store.onDisconnectSet === 'function') await store.onDisconnectSet('presence/' + me, { on: false, at: SERVER_TIME }); } catch (e) { /* best effort */ }
  sync.setPresence(document.visibilityState !== 'hidden');
  if (!moveDone) {
    try { const r = await sync.moveFromV1(v1Storage); moveDone = !!(r && r.done); } catch (e) { /* tries again next time */ }
    schedulePaint();
  }
}

// ---------- the night menu ----------
function showScrim(on) {
  const scrim = $('#scrim');
  if (on) { scrim.hidden = false; void scrim.offsetHeight; scrim.classList.add('open'); }
  else { scrim.classList.remove('open'); if (reduced()) scrim.hidden = true; else setTimeout(() => { if (!S.menu && !S.sheet) scrim.hidden = true; }, 220); }
}
function openMenu(n) {
  const view = sync.week(S.monday);
  const night = view.nights[n];
  S.refused.delete(`${S.monday}|${n}`);
  S.menu = n;
  const st = night ? night.st : 'e';
  const empty = isEmptyNight(night);

function listHTML(dayIdx, step) {

async function doDeal(again) {
  if (S.dealing || !sync) return;
  const mon = S.monday;
  S.dealing = true; S.noSignal = false;
  paint();
  let res = null;
  try { res = again ? await sync.dealAgain(mon, MEALS) : await sync.deal(mon, MEALS); } catch (e) { res = null; }
  S.dealing = false;
  const view = sync.week(mon);
  if (!res || res.ok === false) { S.noSignal = true; S.rows = []; paint(); return; }
  const rev = view.deal ? view.deal.rev : 0;
  const digits = view.deal && typeof view.deal.nights === 'string' ? view.deal.nights.split('').map(Number) : [];
  const fresh = digits.filter((n) => view.nights[n] && typeof view.nights[n].op === 'string' && view.nights[n].op.startsWith(`d${rev}.`));
  const ops = again ? Object.assign({}, S.dealtMon === mon ? S.dealOps : {}) : {};
  for (const n of Object.keys(ops)) if (!view.nights[n] || view.nights[n].op !== ops[n]) delete ops[n];
  for (const n of fresh) ops[n] = view.nights[n].op;

  S.hist = null; S.rows = [];
  paint();
  playLand(fresh);
}

// ---------- save, push, share ----------
function weekLines(view) {
  const lines = [];
  view.nights.forEach((n, i) => {
    if (n && n.st === 'o') { lines.push(`${DAYS[i]}: Eat out`); return; }
    if (n && n.st === 'a') { lines.push(`${DAYS[i]}: Jason away`); return; }
    if (!isHomeN(n)) return;
    const names = [n.m, n.s0, n.s1].filter(Boolean).map((id) => (item(id) ? dispName(item(id)) : null)).filter(Boolean);
    if (names.length) lines.push(`${DAYS[i]}: ${names.join(', ')}`);
  });
  return lines.join('\n');
}

// view is the snapshot of the nights taken at the tap: the same one sync.save built its link from.
async function push(res, view) {
  if (FX && FX.push) return FX.push === 'ok';
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 10000);
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(S.settings.channel), {
      method: 'POST',
      body: weekLines(view),
      headers: { 'Title': res.message, 'Click': res.link, 'Tags': 'fork_and_knife' },
      signal: ctl ? ctl.signal : undefined,
    });
    clearTimeout(timer);
    return r.ok;
  } catch (e) { clearTimeout(timer); return false; }
}

let saveSeq = 0;
async function save() {
  if (!sync) return;
  const mon = S.monday;
  const view0 = sync.week(mon);
  if (!view0.nights.some(isHomeN)) return;
  closeMenu(true);
  const attempt = ++saveSeq;
  S.push = { state: 'sending', note: S.notKept ? 'This phone couldn’t store the week, so it is only kept until you close the page.' : '' };
  const celebrate = shouldCelebrate(view0, S.celebrated); // the first save of a full week plays the confetti, once per week per phone
  if (celebrate) { S.celebrated[view0.monday] = true; kv.set(V2 + 'celebrated', S.celebrated); }
  showMoment('saved', celebrate);
  let res;
  try { res = await sync.save(mon, pageAddress()); } catch (e) { res = { link: weekLink(pageAddress(), toV1Week(view0)), message: saveMessage(S.settings.me, false), updated: false }; }
  const view = view0; // the notification text uses the snapshot the link was built from, never the nights as they are after the wait
  S.push.res = res; S.push.view = view;
  const ok = await push(res, view);
  if (attempt !== saveSeq) return;
  S.push.state = ok ? 'sent' : 'failed';
  if (S.moment && S.moment.kind === 'saved') renderMoment(false);
}
async function retryPush() {
  const p = S.push; if (!p || !p.res) return;
  const attempt = ++saveSeq;
  p.state = 'sending'; renderMoment(false);
  const ok = await push(p.res, p.view);
  if (attempt !== saveSeq) return;
  p.state = ok ? 'sent' : 'failed'; renderMoment(false);
}
function momentNote(t, bad) { const n = $('#momentNote'); if (!n) return; const warn = S.push && S.push.note; n.textContent = warn ? `${t} ${warn}` : t; n.className = 'mnote' + (bad || warn ? ' bad' : ''); }
async function share() {
  const p = S.push; if (!p || !p.res) return;

  try {
    await navigator.share({ title: p.res.message, text: weekLines(p.view), url: p.res.link });
    momentNote('Shared. Check that the message went out.');
  } catch (e) {

}

  const p = S.push; if (!p || !p.res) return;

    ta.value = link; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) { momentNote('Link copied.'); return; }
  } catch (e) { /* show the link below */ }
  momentNote('Couldn’t copy by itself. Press and hold the link below, then Copy.', true);
  const slot = $('#linkSlot');
  if (slot) { slot.innerHTML = `<input class="linkbox" readonly value="${esc(link)}" aria-label="Link">`; const i = slot.querySelector('input'); i.focus(); i.select(); }
}

const CONF = [['#EDE8DE', 30, 96, '50%'], ['#FAF9F6', 78, 150, '2px'], ['#944B8C', 326, 100, '2px'], ['#1E1A16', 350, 176, '50%'], ['#EDE8DE', 36, 90, '2px'],

  }).join('');
  const conf = S.moment.conf && !reduced()
    ? CONF.map((c, i) => `<i class="conf fall" style="--i:${i};--r:${(i * 37) % 70 - 35}deg;left:${c[1]}px;top:${c[2]}px;width:${i % 2 ? 9 : 11}px;height:${i % 2 ? 15 : 11}px;background:${c[0]};border-radius:${c[3]}"></i>`).join('') : '';
  const cnt = homes.length, byJ = homes.filter((x) => x.n.by === 'J').length, byL = homes.filter((x) => x.n.by === 'L').length;
  const dinners = `${cnt} ${cnt === 1 ? 'dinner' : 'dinners'}`;
  let title, sub = '', actions = '', done = '';
  if (kind === 'full') {
    title = 'A full week'; sub = dinners;
    done = '<button class="btn f wide big" data-act="close">Done</button>';
  } else if (p.state === 'sending') {
    title = 'Saving'; sub = 'Sending the list';
  } else if (p.state === 'sent') {
    title = p.res && p.res.updated ? 'Week updated' : 'Week saved'; sub = `${dinners} · list sent`;
    done = '<button class="btn f wide big" data-act="close">Done</button>';
  } else {
    title = 'Week saved'; sub = 'The list did not send';
    actions = `<div class="actions">${navigator.share ? `<button class="btn f" data-act="share">${IC.text}<em>Send by text</em></button>` : ''}<button class="btn ${navigator.share ? 'o' : 'f'}" data-act="copy">${IC.link}<em>Copy link</em></button><button class="qlink" data-act="again">Try again</button></div>`;
    done = '<button class="qlink" data-act="close">Done</button>';
  }
  const warn = p.note && p.state !== 'sending' ? `<div class="mnote bad" id="momentNote">${esc(p.note)}</div>` : '<div class="mnote" id="momentNote" role="status" aria-live="polite"></div>';
  el.className = 'moment' + (play && !reduced() ? ' play' : '');
  el.innerHTML = `<div class="panel">${conf}<div class="fan">${fan}</div></div>
    <div class="center"><div class="hd">${title}</div><div class="sub">${sub}</div></div>
    <div class="tally"><span>${av('J')}${byJ} ${byJ === 1 ? 'night' : 'nights'}</span><span>${av('L')}${byL} ${byL === 1 ? 'night' : 'nights'}</span></div>
    ${actions}${warn}<div id="linkSlot"></div><div class="mdone">${done}</div>`;
}

// ---------- Jason's list (opens from a week link: no setup, no household, no network) ----------
function renderList(app, hash) {
  const dec = decodeWeek(hash);
  if (!dec.ok) {
    app.innerHTML = `<div class="err-page"><h1>This link looks <em>damaged</em></h1>
      <p>It may have been cut off. Ask for the week to be saved again.</p>
      <a class="btn o" href=".">Open the week builder</a></div>`;
    return;
  }
  const week = dec.week, mon = week.monday;
  const list = buildStoreList(week, MEALS);
  const ticks = new Set(kv.get(V1 + 'ticks.' + mon, []));
  const keyOf = (aisle, l) => `${aisle}|${l.name.toLowerCase()}|${l.unit.toLowerCase()}`;
  const all = [];
  list.forEach((g) => g.items.forEach((l) => all.push(keyOf(g.aisle, l))));
  const total = all.length, got = all.filter((k) => ticks.has(k)).length;

  let h = `<div class="top ltop"><div class="brand">${brandMark()}</div><span class="wk">Week of ${shortDate(mon)}</span></div><h1 class="lh1">Store <em>list</em></h1>`;
  if (!total) {
    h += '<p class="sub">Nothing to buy yet.</p>';
  } else {
    h += `<div class="bigcount" aria-live="polite"><div class="bn"><b>${got}</b><span class="of">of ${total}</span></div><div class="lbl">in the<br>cart</div></div>
      <div class="meter"><i style="width:${total ? Math.round(got / total * 100) : 0}%"></i></div>`;
  }
  list.forEach((g) => {
    const gGot = g.items.filter((l) => ticks.has(keyOf(g.aisle, l))).length;
    h += `<div class="aisle"><h2>${esc(g.aisle)}<span>${gGot} of ${g.items.length}</span></h2>`;
    g.items.forEach((l) => {
      const k = keyOf(g.aisle, l), done = ticks.has(k);
      h += `<button class="it${done ? ' done' : ''}" data-act="tick" data-key="${esc(k)}" role="checkbox" aria-checked="${done}"><span class="cb">${done ? IC.check : ''}</span><span class="nm">${esc(l.name)}</span><span class="qty">${esc(fmtQty(l))}</span></button>`;
    });
    h += '</div>';
  });

  h += '<section class="cook"><h2>Day by day</h2><div class="cookwrap">';
  week.days.forEach((day, i) => {
    if (isEatOut(day)) {
      h += `<div class="dayrow out"><span class="dd">${DAYS[i]}</span><span class="mid"><span class="a eo">${IC.eat}Eating out</span></span><span></span></div>`;
      return;
    }
    if (isAway(day)) {
      h += `<div class="dayrow out"><span class="dd">${DAYS[i]}</span><span class="mid"><span class="a eo">${IC.away}Jason away</span></span><span></span></div>`;
      return;
    }
    if (!day || !dayCount(day)) return;
    const main = day.main ? item(day.main) : null;
    const open = S.openDay === i;
    const title = main ? main.name : 'Sides only';
    const w = withLine(day);
    const head = `<button class="dayrow" data-act="toggleday" data-day="${i}" aria-expanded="${open}"><span class="dd">${DAYS[i]}</span><span class="mid"><span class="a">${esc(title)}</span>${w ? `<span class="w">${esc(w)}</span>` : ''}</span><span class="b">${open ? '−' : '+'}</span></button>`;
    if (!open) { h += head; return; }
    h += `<div class="dayopen">${head}`;
    const mins = dayMinutes(day);
    if (mins > 30) h += `<div class="long">about ${mins} min</div>`;
    const dayList = buildStoreList({ v: 1, monday: mon, days: week.days.map((d, di) => (di === i ? d : null)) }, MEALS);
    const needs = [];
    dayList.forEach((g) => g.items.forEach((l) => needs.push(`${l.name} ${fmtQty(l)}`)));
    if (needs.length) h += `<p class="needs">${esc(needs.join(' · '))}</p>`;
    [day.main].concat(day.sides || []).filter(Boolean).forEach((id) => {
      const it = item(id);
      if (!it) { h += '<div class="dish"><h3>A retired item</h3></div>'; return; }
      h += `<div class="dish"><h3>${esc(it.name)}</h3><div class="q">${esc(applianceName(it))} · ${it.minutes} min</div>`;
      if (it.cookidoo && it.cookidoo.url) {
        h += `<a class="cdo" href="${esc(it.cookidoo.url)}" target="_blank" rel="noopener noreferrer">Open in Cookidoo</a>`;
      } else if (it.appliance === 'thermomix' && (!it.steps || !it.steps.length)) {
        h += '<p class="needs">Recipe is in Cookidoo.</p>';
      }
      if (it.steps && it.steps.length) h += `<ol class="steps">${it.steps.map((s) => `<li><span>${esc(s)}</span></li>`).join('')}</ol>`;
      h += '</div>';
    });
    h += '</div>';
  });
  h += `</div></section><div class="foot"><a href=".">Open the week builder</a>${FX ? '<div class="sample">Sample data · assumed</div>' : ''}</div>`;
  app.innerHTML = h;
  S.list = { mon, ticks, hash };
}
function tick(key) {
  const j = S.list; if (!j) return;
  if (j.ticks.has(key)) j.ticks.delete(key); else j.ticks.add(key);
  kv.set(V1 + 'ticks.' + j.mon, Array.from(j.ticks));
  const y = window.scrollY;
  renderList($('#app'), j.hash);
  window.scrollTo(0, y);
}

// ---------- fixtures (made-up data, fixed clock; never in the published page) ----------
async function runFixture(steps) {
  for (const s of steps) {
    if (s.fn) {
      const me = S.settings.me;
      let who = sync;
      if (s.as && s.as !== me) {
        if (!otherPhone) {
          const st = fxServer.client('phone-' + s.as);
          otherPhone = createSync({ store: st, storage: memoryStorage(), me: s.as, now: () => now().getTime(), rng: mulberry32(11) });
          otherPhone.store = st;
          await otherPhone.start();
          await fxServer.settle();
        }
        who = otherPhone;
      }
      if (s.fn === 'pick') who.pick(...s.a);
      else if (s.fn === 'mark') who.mark(...s.a);
      else if (s.fn === 'presence') await who.setPresence(!!s.on);
      else if (s.fn === 'deal') await who.deal(s.a[0], MEALS, { seed: s.seed || 3 });
      await who.idle();
      await fxServer.settle();
    } else if (s.net) {
      store.setOnline(s.net === 'online');
      await fxServer.settle();
      await sleep(10);
    } else if (s.wait) await sleep(s.wait);
  }
  await fxServer.settle();
  S.hist = null;
  S.presence = sync.presence();
}
async function afterMount() {
  if (window.__fxRan || !FX) return;
  window.__fxRan = true;
  window.__fx = { S, sync, store, server: fxServer, other: () => otherPhone, paint, onEvent };
  for (const s of FX.after || []) {
    if (s.wait) await sleep(s.wait);
    else if (s.ui === 'menu') openMenu(s.n);
    else if (s.ui === 'sheet') openFlow(s.n, s.step || 0);
    else if (s.ui === 'deal') await doDeal(false);
    else if (s.ui === 'save') { await save(); }
    else if (s.ui === 'full') { showMoment('full'); }
    else if (s.event) onEvent(s.event);
    else if (s.late) { await runFixture([s.late]); schedulePaint(); }
    else if (s.click) { const e = $(s.click); if (e) e.click(); }
  }
}

// ---------- events ----------
const PICKS = new Set(['choose', 'eat', 'away', 'clear', 'skip', 'back', 'slot']);
document.addEventListener('touchstart', () => {}, { passive: true }); // lets iOS show the pressed state
document.addEventListener('click', (e) => {
  if (e.target.id === 'scrim') return; // outside taps never close or change anything
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.getAttribute('aria-disabled') === 'true' || act === 'none') return;
  if (el.closest('#sheet')) {
    const t = performance.now();
    if (t < S.openUntil) return;
    if (PICKS.has(act) && t < S.busyUntil) return;
  } else if (el.closest('#menu')) {
    if (performance.now() < S.openUntil) return;
  } else if (el.closest('#moment')) {
    if (performance.now() < S.openUntil) return;
  } else if (sheetOpen() || S.menu !== null || S.moment) return;
  switch (act) {
    case 'tab': S.which = el.dataset.which; S.hist = null; S.rows = []; S.dealtMon = null; S.dealOps = {}; paint(); window.scrollTo(0, 0); break;
    case 'night': openMenu(Number(el.dataset.day)); break;
    case 'menu-close': closeMenu(); break;
    case 'menu-home': { const n = S.menu; closeMenu(true); openFlow(n, firstStep(n)); break; }
    case 'menu-o': menuSet('o'); break;
    case 'menu-a': menuSet('a'); break;
    case 'menu-clear': menuClear(); break;
    case 'done': closeSheet(); break;
    case 'close': hideMoment(); break;
    case 'back': back(); break;
    case 'slot': jumpSlot(Number(el.dataset.step)); break;
    case 'choose': choose(el.dataset.id); break;
    case 'eat': setNightState('o'); break;
    case 'away': setNightState('a'); break;
    case 'clear': clearPick(); break;
    case 'skip': skip(); break;
    case 'deal': doDeal(false); break;
    case 'deal-again': doDeal(true); break;
    case 'keep': keepDeal(); break;
    case 'swap': swapNight(Number(el.dataset.day)); break;
    case 'save': save(); break;
    case 'again': retryPush(); break;
    case 'share': share(); break;
    case 'copy': copyLink(); break;
    case 'paste': {
      const input = $('#code');
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then((t) => { S.setup.value = (t || '').trim(); S.setup.error = ''; renderSetup($('#app')); }, () => { if (input) input.focus(); });
      } else if (input) input.focus();
      break;
    }
    case 'code-go': codeGo(); break;
    case 'who': pickWho(el.dataset.who); break;
    case 'tick': tick(el.dataset.key); break;
    case 'toggleday': { const d = Number(el.dataset.day); S.openDay = S.openDay === d ? null : d; const y = window.scrollY; renderList($('#app'), S.list.hash); window.scrollTo(0, y); break; }
    default: break;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'code') return;
  S.setup.value = e.target.value; S.setup.error = '';
  const go = $('#codeGo'); if (go) go.classList.toggle('off', !e.target.value.trim());
  const f = $('#field'); if (f) f.classList.remove('bad');
  const er = $('#codeErr'); if (er) er.innerHTML = '';
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.sheet) closeSheet(); else if (S.menu !== null) closeMenu(); else if (S.moment) hideMoment(); }
  if (e.key === 'Enter' && e.target.id === 'code') { e.preventDefault(); codeGo(); }
});

if (FX && FX.setup) { S.settings = null; if (FX.setup.value) S.setup.value = FX.setup.value; if (FX.setup.step) S.setup.step = FX.setup.step; if (FX.setup.pending) S.setup.pending = FX.setup.pending; }
else if (FX && FX.settings) S.settings = FX.settings;
route();
if (FX && FX.setup && FX.setup.go) codeGo();
})();

</script>
