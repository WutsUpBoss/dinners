<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dinners</title>
<meta name="theme-color" content="#F5EEDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinners">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Dinners week page. Look: mockup A (menu card), calmer. Nothing under 16px. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F5EEDF; --panel:#EBE0CB; --ink:#2A2119; --rule:#D8CBB2; --dots:#BFB09A;
  --muted:#6F6252; --faint:#756858; --red:#9B3A26;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
}
html{background:#DDD1BB;-webkit-text-size-adjust:100%}
html.locked,html.locked body{height:100%;overflow:hidden}
body{font:400 16px/1.4 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto;background:var(--paper);min-height:100vh;min-height:100dvh;position:relative;padding:calc(14px + env(safe-area-inset-top)) 20px 0}
button{font:inherit;color:inherit;background:none;border:0;text-align:left;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
em{font-style:italic}

/* type pieces */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;color:var(--muted)}
.top .wk{font:500 16px/1.2 var(--sans);color:var(--muted)}
.linkbtn{font:500 16px/1.2 var(--sans);color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:14px 0 14px 16px;margin:-6px 0}
h1{font-family:var(--serif);font-variation-settings:'opsz' 144,'SOFT' 50;font-weight:400;font-size:42px;line-height:1.04;letter-spacing:-.02em;margin:6px 0 4px}
h1 em{color:var(--red)}
.sub{font-size:16px;color:var(--muted);margin-top:6px}

/* tabs */
.tabs{display:flex;margin:18px 0 0;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;min-height:52px;padding:14px 0 12px;font:600 16px/1.2 var(--sans);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:active{background:var(--panel)}

/* day rail: a quiet summary; tapping a day opens that night */
.rail{position:sticky;top:0;z-index:5;display:flex;margin:12px -20px 0;padding:0 14px;background:var(--paper);border-top:3px double var(--ink);border-bottom:1px solid var(--rule)}
.rail button{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0 11px;font:600 16px/1 var(--sans);color:var(--muted);min-height:56px}
.rail button:active{background:var(--panel)}
.rail button.has{color:var(--ink)}
.rail .dots{display:flex;gap:3px;height:11px;align-items:center}
.rail .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dots);background:transparent}
.rail .dot.on{background:var(--red);border-color:var(--red)}
.rail .dot.pop{animation:pop 260ms cubic-bezier(.2,1.6,.4,1) 120ms both}
.rail .dash{display:block;width:20px;height:0;border-top:1.5px solid var(--muted);margin:0 6px}
.rail.wave .dot.on{animation:pop 280ms cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--d) * 40ms)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.7)}100%{transform:scale(1)}}

/* the week: one row per night, whole row is the tap target */
.night{display:grid;grid-template-columns:62px 1fr;align-items:start;width:calc(100% + 40px);margin:0 -20px;padding:18px 20px 18px;min-height:84px;
  background-image:linear-gradient(var(--rule),var(--rule));background-size:calc(100% - 40px) 1px;background-position:20px 100%;background-repeat:no-repeat;
  transition:background-color 90ms}
.night:active{background-color:var(--panel)}
.nd{display:block}
.dn{display:block;font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.1}
.dd{display:block;font:500 16px/1 var(--sans);color:var(--muted);margin-top:7px}
.dd.today{color:var(--red);font-weight:600}
.nb{display:block;min-width:0}
.nt{display:block;font-family:var(--serif);font-variation-settings:'opsz' 36;font-weight:500;font-size:24px;line-height:1.14;letter-spacing:-.01em}
.nt.none{font-style:italic;font-weight:400;color:var(--faint)}
.nt.out{font-style:italic;font-weight:400;color:var(--muted)}
.ns{display:block;margin-top:5px;font-size:16px;line-height:1.35;color:var(--muted)}
.ns.add{color:var(--faint)}
.ns.long{color:var(--red);font-weight:500}
.plus{display:block;position:relative;width:22px;height:22px;margin-top:2px}
.plus:before,.plus:after{content:'';position:absolute;background:var(--red);left:50%;top:50%;transform:translate(-50%,-50%)}
.plus:before{width:14px;height:1.75px}
.plus:after{width:1.75px;height:14px}
.night.drop .nb{animation:drop 380ms cubic-bezier(.2,.9,.3,1) 180ms both}
@keyframes drop{0%{transform:translateY(-16px);opacity:0}55%{transform:translateY(3px);opacity:1}100%{transform:translateY(0);opacity:1}}

/* save bar */
.savebar{position:sticky;bottom:0;z-index:6;margin:10px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:14px}
.savebar .btn{flex:none}
.savebar .st{font-size:16px;line-height:1.25;color:var(--muted)}
.savebar .st b{display:block;color:var(--ink);font-weight:600}
.btn{display:inline-block;white-space:nowrap;background:var(--ink);color:var(--paper);text-align:center;padding:15px 22px;font:600 16px/1.1 var(--sans);letter-spacing:.02em;border-radius:3px;min-height:52px;transition:transform 80ms}
.btn:active{transform:scale(.97)}
.btn.off{background:transparent;color:var(--muted);border:1.5px solid var(--dots)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.block{display:block;width:100%}
.foot{padding:22px 0 26px;font-size:16px;color:var(--muted)}
.sample{font:500 16px/1.2 var(--sans);color:var(--faint)}

/* the panel: fixed height, set once when it opens; only the list inside scrolls */
.scrim{position:fixed;inset:0;background:rgba(42,33,25,.42);opacity:0;transition:opacity 200ms;z-index:20}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;width:100%;display:flex;flex-direction:column;background:var(--paper);border-radius:18px 18px 0 0;border-top:3px double var(--ink);box-shadow:0 -10px 30px rgba(42,33,25,.25);transform:translateY(105%);transition:transform 260ms var(--ease);z-index:21;overflow:hidden}
.sheet.open{transform:translateY(0)}
.sheet[hidden],.scrim[hidden],.cele[hidden]{display:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--dots);margin:9px auto 0;flex:none}
.sh{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;padding:0 8px 0 8px;border-bottom:1px solid var(--rule)}
.back{width:56px;height:56px;display:flex;align-items:center;justify-content:flex-start;padding-left:12px;color:var(--ink)}
.back:disabled{visibility:hidden}
.back:active{color:var(--red)}
.done{justify-self:end;min-height:56px;padding:0 12px 0 20px;font:600 16px/1 var(--sans);color:var(--ink)}
.done:active{color:var(--red)}
.dots3{display:flex;gap:12px;align-items:center}
.dots3 .d{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--dots);background:transparent}
.dots3 .d.on{background:var(--red);border-color:var(--red)}
.dots3 .d.cur{box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--ink)}
.dots3 .d.pop{animation:pop 260ms cubic-bezier(.2,1.6,.4,1)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform 260ms var(--ease),opacity 260ms ease}
.pane.from-r{transform:translateX(56px);opacity:0}
.pane.from-l{transform:translateX(-56px);opacity:0}
.pane.to-l{transform:translateX(-56px);opacity:0;pointer-events:none}
.pane.to-r{transform:translateX(56px);opacity:0;pointer-events:none}
.pt{flex:none;padding:16px 20px 10px}
.pday{font-size:16px;color:var(--muted)}
.pt h2{font-family:var(--serif);font-variation-settings:'opsz' 72;font-weight:500;font-size:34px;line-height:1.08;letter-spacing:-.015em;margin-top:2px}
.pw{margin-top:4px;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.25;color:var(--muted)}
.pl{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.msg{position:absolute;left:20px;right:20px;bottom:16px;z-index:2;pointer-events:none;font-size:16px;color:var(--paper);font-weight:600}
.msg:not(:empty){background:var(--ink);padding:10px 14px;border-radius:3px}
.sect{margin:26px 0 2px}
.sect h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;letter-spacing:-.01em;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;width:calc(100% + 40px);margin:0 -20px;padding:12px 20px;min-height:68px;
  background-image:linear-gradient(var(--rule),var(--rule));background-size:calc(100% - 40px) 1px;background-position:20px 100%;background-repeat:no-repeat;transition:background-color 90ms}
.row:active:not(.taken){background-color:var(--panel)}
.row.sel{background-color:var(--panel)}
.rn{grid-column:1;font-family:var(--serif);font-variation-settings:'opsz' 36;font-weight:500;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.rt{grid-column:1;margin-top:3px;font-size:16px;line-height:1.3;color:var(--muted)}
.rt .fresh{color:var(--red);font-weight:600}
.rk{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:12px;justify-self:end}
.ct{font:500 16px/1 var(--sans);color:var(--muted)}
.ck{display:none;width:22px;height:22px;position:relative}
.row.sel .ck{display:block}
.ck:after{content:'';position:absolute;left:7px;top:1px;width:7px;height:14px;border:solid var(--red);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.row.land .rn{animation:drop 380ms cubic-bezier(.2,.9,.3,1)}
.row.land .ck:after{animation:tick 200ms ease-out}
.row.eat{min-height:64px}
.row.eat .rn{font-style:italic;font-weight:400;color:var(--muted)}
.row.eat.sel .rn{color:var(--ink)}
.row.quiet{min-height:56px}
.row.quiet .rn{font:500 16px/1.2 var(--sans);color:var(--muted);letter-spacing:0}
.row.taken{opacity:.45}
.pad{padding-top:6px}
.pad p{font-size:18px;line-height:1.4;margin-bottom:16px}
.pad .btn{margin-bottom:10px}
.note{font-size:16px;line-height:1.4;color:var(--muted);margin:0 0 12px}
.note:empty{display:none}
.note.bad{color:var(--red);font-weight:600}
.linkbox{width:100%;font:500 16px var(--mono);padding:12px;border:1.5px solid var(--ink);background:#fff;border-radius:3px;margin-bottom:10px}

/* setup */
.setup label{display:block;margin:22px 0 0;font:600 16px var(--sans)}
.setup .hint{display:block;font-weight:400;color:var(--muted);margin:2px 0 8px;font-size:16px;line-height:1.35}
.setup input{display:block;width:100%;font:500 18px var(--sans);padding:13px 12px;border:1.5px solid var(--ink);border-radius:3px;background:#FBF7EC;color:var(--ink)}
.setup .btn{margin-top:26px}
.setup .err{color:var(--red);font-weight:600;margin-top:10px}
.setup .rule{border-top:3px double var(--ink);margin-top:20px}

/* celebration */
.cele{overflow:hidden;position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(42,33,25,.55);transition:opacity 200ms}
.cele.out{opacity:0}
.cele .card{position:relative;text-align:center;width:min(310px,82vw);padding:28px 22px 24px;background:var(--paper);box-shadow:0 18px 40px rgba(0,0,0,.35);border-top:3px double var(--ink);border-bottom:3px double var(--ink);animation:stamp 360ms cubic-bezier(.2,1.5,.4,1) both;transform:rotate(-2deg)}
.cele h2{font-family:var(--serif);font-variation-settings:'opsz' 144,'SOFT' 50;font-weight:400;font-style:italic;font-size:48px;line-height:1;letter-spacing:-.02em;color:var(--red)}
.cele p{margin-top:10px;font-size:18px;color:var(--ink)}
.bit{position:absolute;left:50%;top:50%;width:9px;height:15px;margin:-7px 0 0 -4px;border-radius:1px;opacity:0;animation:burst 500ms cubic-bezier(.1,.8,.3,1) both;animation-delay:calc(var(--i) * 2ms)}
@keyframes stamp{0%{transform:scale(1.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.5);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}
.cele.hold .bit{animation:none;transform:translate(calc(var(--x) * .62),calc(var(--y) * .62)) rotate(var(--r));opacity:1}

/* Store list view */
.bigcount{display:flex;align-items:flex-end;gap:14px;margin:20px 0 0}
.bigcount b{font-family:var(--serif);font-variation-settings:'opsz' 144,'SOFT' 50;font-weight:400;font-size:96px;line-height:.82;letter-spacing:-.04em;color:var(--ink)}
.bigcount .of{font-family:var(--serif);font-size:34px;line-height:1;color:var(--muted);letter-spacing:-.02em;margin-left:4px}
.bigcount .lbl{font-size:18px;line-height:1.2;color:var(--ink);padding-bottom:4px}
.bar{height:5px;background:var(--rule);margin:16px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width 300ms}
.aisle{margin-top:28px}
.aisle h2{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-weight:500;font-size:25px;letter-spacing:-.01em;border-bottom:1px solid var(--ink);padding-bottom:6px}
.aisle h2 span{font:500 16px var(--sans);color:var(--muted)}
.it{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:0 14px;width:100%;padding:11px 0;border-bottom:1px solid #E1D6C0;min-height:60px;transition:background-color 90ms}
.it:active{background:var(--panel)}
.cb{width:26px;height:26px;border:1.5px solid var(--ink);border-radius:2px;position:relative;align-self:center}
.it .nm{font-size:18px;font-weight:500;line-height:1.25}
.it .qty{font-size:17px;color:var(--muted);text-align:right;white-space:nowrap}
.it.done .cb{background:var(--ink)}
.it.done .cb:after{content:'';position:absolute;left:8px;top:2px;width:7px;height:14px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);animation:tick 160ms ease-out}
.it.done .nm{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
@keyframes tick{0%{transform:rotate(45deg) scale(.2)}100%{transform:rotate(45deg) scale(1)}}
.cook{margin-top:44px}
.cook h2{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.015em;line-height:1.05;margin:0 0 12px}
.dayrow{display:grid;grid-template-columns:52px 1fr auto;align-items:start;gap:0 6px;width:100%;padding:16px 0;border-bottom:1px solid var(--rule);min-height:64px;transition:background-color 90ms}
button.dayrow:active{background:var(--panel)}
.dayrow .dd{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.2;color:var(--muted);margin:0}
.dayrow .mid{display:block}
.dayrow .a{display:block;font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.2}
.dayrow .a.eo{font-style:italic;font-weight:400;color:var(--muted)}
.dayrow .w{display:block;margin-top:3px;font-size:16px;color:var(--muted);line-height:1.35}
.dayrow .b{color:var(--muted);font:500 26px/1 var(--sans)}
.cookwrap{border-top:1px solid var(--ink)}
.dayopen{background:var(--panel);margin:0 -20px;padding:0 20px 20px;border-bottom:1px solid var(--rule)}
.dayopen .dayrow{border:0}
.dayopen .dayrow .b{color:var(--red)}
.long{font-size:16px;color:var(--red);font-weight:500;margin:-6px 0 6px 58px}
.needs{font-size:16px;line-height:1.5;color:var(--muted);margin:6px 0}
.dish{margin-top:14px;padding-top:12px;border-top:1px solid var(--dots)}
.dish h3{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.15}
.dish .q{margin:3px 0 8px;font-size:16px;color:var(--muted)}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;font-size:17px;line-height:1.42;padding:8px 0;border-top:1px dotted var(--dots)}
.steps li:before{content:counter(s);font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.1;color:var(--red)}
.cdo{display:inline-block;margin-top:6px;padding:13px 18px;border:1.5px solid var(--ink);border-radius:3px;font:600 16px var(--sans);text-decoration:none;min-height:52px}
.err-page{padding-top:20px}
.err-page p{font-size:18px;line-height:1.45;margin:6px 0 20px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.row.eat:not(.sel) .ck{display:block}
.row.eat:not(.sel) .ck:after{left:2px;top:2px;width:16px;height:16px;border:1.5px solid var(--dots);border-radius:50%;transform:none}

</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Plan dinner" hidden>
  <div class="grab"></div>
  <div class="sh" id="sheetHead"></div>
  <div class="stage" id="sheetStage"></div>
  <div class="msg" id="sheetMsg" role="status" aria-live="polite"></div>
</div>
<div class="cele" id="cele" hidden></div>

"Heavy cream","amount":2,"unit":"tbsp","aisle":"Dairy"}],"steps":[],"cookidoo":{"url":"https://cookidoo.thermomix.com/recipes/recipe/en-US/r756444","title":"Creamed Spinach","search":"creamed spinach"},"retired":false},{"id":"s-tm-cauliflower-mash","name":"Cauliflower mash (Thermomix)","appliance":"thermomix","ovenTempF":null,"minutes":25,"ingredients":[{"name":"Cauliflower","amount":0.5,"unit":"head","aisle":"Produce"},{"name":"Parmesan (block)","amount":0.5,"unit":"oz","aisle":"Dairy"},{"name":"Garlic","amount":1,"unit":"clove","aisle":"Produce"},{"name":"Ghee","amount":0.5,"unit":"tbsp","aisle":"Pantry"}],"steps":[],"cookidoo":{"url":"https://cookidoo.thermomix.com/recipes/recipe/en-US/r150480","title":"Cauliflower mash","search":"cauliflower mash"},"retired":false}]};

<script>
// Dinners page logic. Plain ES module, no dependencies. Works in iOS Safari and Node 18+.
// Shapes follow work-orders/SCHEMA-meals-and-rules.md.

const TZ = 'America/Chicago';
const DAY_COUNT = 7;

// ---------- dates ----------

function pad(n) { return String(n).padStart(2, '0'); }

function isoFromUTC(ms) {
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
}

function utcMs(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return NaN;
  const ms = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  return isoFromUTC(ms) === iso ? ms : NaN; // rejects 2026-02-31 and similar
}

function isValidISODate(iso) {
  return typeof iso === 'string' && !Number.isNaN(utcMs(iso));
}

function addDays(iso, n) {
  return isoFromUTC(utcMs(iso) + n * 86400000);
}

// Calendar date (YYYY-MM-DD) and weekday (Mon=0 .. Sun=6) of an instant in a time zone.
function localDate(now, tz = TZ) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(now);
  const get = (t) => parts.find((p) => p.type === t).value;
  const iso = `${get('year')}-${get('month')}-${get('day')}`;
  const dow = (new Date(utcMs(iso)).getUTCDay() + 6) % 7;
  return { iso, dow };
}

// The Monday on or before today.
function thisMonday(now, tz = TZ) {
  const { iso, dow } = localDate(now, tz);
  return addDays(iso, -dow);
}

// Tuesday-Sunday: the next Monday. Monday: the Monday 7 days later.
function comingMonday(now, tz = TZ) {
  const { iso, dow } = localDate(now, tz);
  return addDays(iso, 7 - dow);
}

function daysBetween(fromISO, toISO) {
  return Math.round((utcMs(toISO) - utcMs(fromISO)) / 86400000);
}

// ---------- weeks ----------

function emptyWeek(monday) {
  return { v: 1, monday, days: Array.from({ length: DAY_COUNT }, () => null) };
}

function findItem(meals, id) {
  if (!meals || typeof id !== 'string') return null;
  for (const list of [meals.mains, meals.sides]) {
    if (!Array.isArray(list)) continue;
    for (const it of list) if (it.id === id) return it;
  }
  return null; // retired items are still in the lists, so they are found
}

function dayMain(day) { return day && day.main ? day.main : null; }
function isEatOut(day) { return !!(day && day.out === true); }

// Marks a night as eating out (on) or clears it (off). An eat-out night has no main or sides,
// so it adds nothing to the store list, "last had" or pick counts. Picking a main or side later replaces it.
function setEatOut(week, dayIndex, on) {
  if (!week || !Array.isArray(week.days)) return { ok: false, error: 'no week' };
  if (!Number.isInteger(dayIndex) || dayIndex < 0 || dayIndex >= DAY_COUNT) return { ok: false, error: 'bad day' };
  const days = week.days.slice();
  days[dayIndex] = on ? { out: true } : null;
  return { ok: true, week: { ...week, days } };
}
function daySides(day) { return day && Array.isArray(day.sides) ? day.sides : []; }

function canSave(week) {
  return !!(week && Array.isArray(week.days) && week.days.some((d) => dayMain(d)));
}

function isCelebration(week) {
  if (!week || !Array.isArray(week.days)) return false;
  const withMain = week.days.filter((d) => dayMain(d));
  if (withMain.length < 4) return false;
  return withMain.every((d) => daySides(d).filter(Boolean).length === 2);
}

// slot: 'main', 0 or 1 (side position). id null clears the slot.
// Returns { ok:true, week } (a new object) or { ok:false, error }.
function validatePick(week, dayIndex, slot, id) {
  if (!week || !Array.isArray(week.days)) return { ok: false, error: 'no week' };
  if (!Number.isInteger(dayIndex) || dayIndex < 0 || dayIndex >= DAY_COUNT) return { ok: false, error: 'bad day' };
  if (slot !== 'main' && slot !== 0 && slot !== 1) return { ok: false, error: 'bad slot' };
  if (id !== null && typeof id !== 'string') return { ok: false, error: 'bad id' };
  if (id !== null) {
    if (slot === 'main' && !id.startsWith('m-')) return { ok: false, error: 'not a main' };
    if (slot !== 'main' && !id.startsWith('s-')) return { ok: false, error: 'not a side' };
  }
  const cur = week.days[dayIndex] || { main: null, sides: [null, null] };
  const sides = [cur.sides && cur.sides[0] || null, cur.sides && cur.sides[1] || null];
  let main = cur.main || null;
  if (slot === 'main') {
    main = id;
  } else {
    const other = sides[slot === 0 ? 1 : 0];
    if (id !== null && other === id) return { ok: false, error: 'That side is already on this day.' };
    sides[slot] = id; // replaces any earlier pick
  }
  const day = (main || sides[0] || sides[1]) ? { main, sides } : null;
  const days = week.days.slice();
  days[dayIndex] = day;
  return { ok: true, week: { ...week, days } };
}

// ---------- dinner time ----------

function lanePair(minutesList) {
  const slots = [0, 0];
  for (const m of [...minutesList].sort((a, b) => b - a)) {
    slots[slots[0] <= slots[1] ? 0 : 1] += m;
  }
  return Math.max(slots[0], slots[1]);
}

function dinnerMinutes(main, sides) {
  const items = [main, ...(sides || [])].filter(Boolean);
  const oven = new Map(); // temp -> longest minutes
  let thermomix = 0;
  const pairLanes = { stovetop: [], 'ninja-grill': [] };
  let best = 0;
  for (const it of items) {
    const m = Number(it.minutes) || 0;
    switch (it.appliance) {
      case 'oven': {
        const k = String(it.ovenTempF);
        oven.set(k, Math.max(oven.get(k) || 0, m));
        break;
      }
      case 'thermomix': thermomix += m; break;
      case 'stovetop':
      case 'ninja-grill': pairLanes[it.appliance].push(m); break;
      default: best = Math.max(best, m); // none: its own lane
    }
  }
  let ovenTotal = 0;
  for (const v of oven.values()) ovenTotal += v;
  return Math.max(best, ovenTotal, thermomix, lanePair(pairLanes.stovetop), lanePair(pairLanes['ninja-grill']));
}

// ---------- store list ----------

function round(n) { return Math.round(n * 1000) / 1000; }

// Returns [{ aisle, items: [{ name, unit, amount, days:[dayIndex...] }] }] in aisle order.
function buildStoreList(week, meals) {
  const lines = new Map(); // key -> line
  const days = week && Array.isArray(week.days) ? week.days : [];
  days.forEach((day, di) => {
    if (!day) return;
    const ids = [day.main, ...daySides(day)].filter(Boolean);
    for (const id of ids) {
      const item = findItem(meals, id);
      if (!item || !Array.isArray(item.ingredients)) continue;
      for (const ing of item.ingredients) {
        const name = String(ing.name).trim();
        const unit = String(ing.unit).trim();
        const key = `${ing.aisle}\u0000${name.toLowerCase()}\u0000${unit.toLowerCase()}`;
        let line = lines.get(key);
        if (!line) {
          line = { name, unit, amount: 0, aisle: ing.aisle, days: [] };
          lines.set(key, line);
        }
        line.amount = round(line.amount + Number(ing.amount));
        if (!line.days.includes(di)) line.days.push(di);
      }
    }
  });
  const order = (meals && meals.aisles) || [];
  const groups = new Map();
  for (const line of lines.values()) {
    if (!groups.has(line.aisle)) groups.set(line.aisle, []);
    const { aisle, ...rest } = line;
    rest.days.sort((a, b) => a - b);
    groups.get(aisle).push(rest);
  }
  const aisleNames = [...groups.keys()].sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
  return aisleNames.map((aisle) => ({
    aisle,
    items: groups.get(aisle).sort((a, b) =>
      a.name.toLowerCase().localeCompare(b.name.toLowerCase()) || a.unit.localeCompare(b.unit)),
  }));
}

// ---------- link ----------

function toB64url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromB64url(s) {
  if (!/^[A-Za-z0-9_-]*$/.test(s)) throw new Error('not base64url');
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
}

// Compact form: { v, m: monday, d: [null | "o" (eat out) | [main, side0, side1] x7] }
function encodeWeek(week) {
  const compact = {
    v: 1,
    m: week.monday,
    d: week.days.map((day) => isEatOut(day) ? 'o' : day
      ? [day.main || null, daySides(day)[0] || null, daySides(day)[1] || null]
      : null),
  };
  return toB64url(JSON.stringify(compact));
}

const ID_RE = /^[a-z0-9]+(-[a-z0-9]+)*$/;

function decodeWeek(str) {
  try {
    if (typeof str !== 'string') return { ok: false, error: 'no link value' };
    let s = str.trim();
    const at = s.indexOf('w=');
    if (at >= 0) s = s.slice(at + 2);
    else if (s.startsWith('#')) s = s.slice(1);
    if (!s) return { ok: false, error: 'empty' };
    const c = JSON.parse(fromB64url(s));
    if (!c || typeof c !== 'object' || c.v !== 1) return { ok: false, error: 'unknown version' };
    if (!isValidISODate(c.m)) return { ok: false, error: 'bad date' };
    if (!isMonday(c.m)) return { ok: false, error: 'week does not start on a Monday' };
    if (!Array.isArray(c.d) || c.d.length !== DAY_COUNT) return { ok: false, error: 'bad days' };
    const idOk = (v, p) => v === null || (typeof v === 'string' && v.startsWith(p) && ID_RE.test(v.slice(2)) && v.length <= 80);
    const days = [];
    for (const d of c.d) {
      if (d === null) { days.push(null); continue; }
      if (d === 'o') { days.push({ out: true }); continue; }
      if (!Array.isArray(d) || d.length !== 3) return { ok: false, error: 'bad day' };
      if (!idOk(d[0], 'm-') || !idOk(d[1], 's-') || !idOk(d[2], 's-')) return { ok: false, error: 'bad id' };
      if (d[1] && d[1] === d[2]) return { ok: false, error: 'same side twice' };
      days.push(d[0] || d[1] || d[2] ? { main: d[0], sides: [d[1], d[2]] } : null);
    }
    return { ok: true, week: { v: 1, monday: c.m, days } };
  } catch (e) {
    return { ok: false, error: 'damaged link' };
  }
}

function weekLink(base, week) {
  return `${base}#w=${encodeWeek(week)}`;
}

// ---------- last had ----------

// savedWeeks: array of weeks (a later entry with the same Monday replaces an earlier one)
// or an object keyed by Monday. Returns { [id]: { daysAgo: number|null, label } }.
function isMonday(iso) {
  return isValidISODate(iso) && new Date(iso + 'T12:00:00Z').getUTCDay() === 1;
}

// How many times each id was picked across all saved weeks (any day, past or coming).
// A re-saved Monday replaces the earlier save, as in lastHad.
function pickCounts(savedWeeks, ids) {
  const byMonday = new Map();
  const list = Array.isArray(savedWeeks) ? savedWeeks : Object.values(savedWeeks || {});
  for (const w of list) if (w && isValidISODate(w.monday)) byMonday.set(w.monday, w);
  const count = {};
  for (const w of byMonday.values()) {
    for (const day of w.days) {
      if (!day) continue;
      for (const id of [day.main, ...daySides(day)]) if (id) count[id] = (count[id] || 0) + 1;
    }
  }
  const out = {};
  for (const id of ids) out[id] = count[id] || 0;
  return out;
}

function lastHad(savedWeeks, todayISO, ids) {
  const byMonday = new Map();
  const list = Array.isArray(savedWeeks) ? savedWeeks : Object.values(savedWeeks || {});
  for (const w of list) if (w && isValidISODate(w.monday)) byMonday.set(w.monday, w);
  const latest = {}; // id -> most recent date before today
  for (const w of byMonday.values()) {
    w.days.forEach((day, i) => {
      if (!day) return;
      const date = addDays(w.monday, i);
      if (date >= todayISO) return; // today and future do not count
      for (const id of [day.main, ...daySides(day)]) {
        if (id && (!latest[id] || date > latest[id])) latest[id] = date;
      }
    });
  }
  const out = {};
  for (const id of ids) {

function advanceToNextNight() {
  const sh = S.sheet;
  const delay = reduced() ? 0 : 190;
  lock('busyUntil', delay + GLIDE + 50);
  setTimeout(() => { if (!S.sheet || S.sheet.kind !== 'flow') return; const n = nextEmpty(sh.day); if (n === null) closeSheet(); else goStep(n, 0, 1); }, delay);
}
function clearPick() {
  const sh = S.sheet; if (!sh || sh.kind !== 'flow') return;
  const r = validatePick(S.week, sh.day, slotOf(sh.step), null);
  if (!r.ok) { setMsg(r.error); return; }
  commit(r.week, sh.day);
  refreshList(null);
}
function skip() {
  const sh = S.sheet; if (!sh || sh.kind !== 'flow') return;
  lock('busyUntil', GLIDE + 50);
  advance();
}
function back() {
  const sh = S.sheet; if (!sh || sh.kind !== 'flow' || sh.step === 0) return;
  goStep(sh.day, sh.step - 1, -1);
}

// ---------- celebration ----------
let celeTimer = null;
function celebrate(hold) {
  const el = $('#cele');
  if (!el) return;
  const n = S.week.days.filter((d) => d && d.main).length;
  const colors = ['#C4553D', '#F5EEDF', '#BFB09A', '#C4553D', '#EBE0CB'];
  let bits = '';
  if (!reduced()) {
    for (let i = 0; i < 36; i++) {
      const a = (i * 137.5) * Math.PI / 180, d = 105 + (i * 37) % 120;
      bits += `<i class="bit" style="--i:${i};--x:${Math.round(Math.cos(a) * d)}px;--y:${Math.round(Math.sin(a) * d)}px;--r:${(i * 53) % 360}deg;background:${colors[i % 5]}"></i>`;
    }
  }
  el.innerHTML = `${bits}<div class="card"><h2>A full week.</h2><p>${n} dinners</p></div>`;
  el.className = 'cele' + (hold ? ' hold' : '');
  el.hidden = false;
  if (!reduced()) { S.wave = true; renderRail(); S.wave = false; }
  clearTimeout(celeTimer);
  if (!hold) celeTimer = setTimeout(() => hideCele(false), reduced() ? 3000 : 2300);
}
function hideCele(instant) {
  const el = $('#cele');
  clearTimeout(celeTimer);
  if (!el || el.hidden) return;
  if (instant || reduced()) { el.hidden = true; return; }
  el.classList.add('out');
  setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 210);
}

// ---------- save, push, share ----------
function weekLines() {
  const lines = [];
  S.week.days.forEach((day, i) => {
    if (isEatOut(day)) { lines.push(`${DAYS[i]}: Eating out`); return; }
    if (!day) return;
    const names = [day.main].concat(day.sides || []).filter(Boolean).map((id) => (item(id) ? item(id).name : null)).filter(Boolean);
    if (names.length) lines.push(`${DAYS[i]}: ${names.join(', ')}`);
  });
  return lines.join('\n');
}
const currentLink = () => weekLink(pageAddress(), S.week);

function resultShell(title, inner) {
  $('#sheetHead').innerHTML = '<span></span><span></span><button class="done" data-act="close">Done</button>';
  const stage = $('#sheetStage');
  stage.innerHTML = `<div class="pane"><div class="pt"><h2>${title}</h2></div><div class="pl pad">${inner}</div></div>`;
  setMsg('');
  showSheet('result');
}
function openResult(state, extra) {
  S.sheet = { kind: 'result' };
  S.result = Object.assign({ state }, extra || {});
  const r = S.result, him = himName();
  let title, text = '', buttons = '';
  if (state === 'sending') {
    title = r.updated ? 'Updating…' : 'Sending…';
  } else if (state === 'sent') {
    title = r.updated ? 'Updated.' : 'Sent.';
    text = `<p>On ${him ? esc(him) + '’s' : 'the cook’s'} phone.</p>`;
    buttons = '<button class="btn block" data-act="close">Done</button><button class="btn line block" data-act="copy">Copy link</button>';
  } else {
    title = 'Not sent.';
    text = r.note ? '<p>Send the link another way.</p>' : '<p>Your week is saved here. Send the link another way.</p>';
    if (navigator.share) buttons += '<button class="btn block" data-act="share">Send by text</button>';
    buttons += `<button class="btn ${navigator.share ? 'line ' : ''}block" data-act="copy">Copy link</button><button class="btn line block" data-act="again">Try again</button>`;
  }
  resultShell(title, `${text}<div id="resultNote" class="note${r.note ? ' bad' : ''}" role="status" aria-live="polite">${esc(r.note || '')}</div>${buttons}<div id="linkSlot"></div>`);
}
// Every status line on the result panel keeps the storage warning when the week could not be stored.
function resultNote(t, bad) {
  const n = $('#resultNote'); if (!n) return;
  const warn = S.result && S.result.note;
  n.textContent = warn ? `${t} ${warn}` : t;
  n.className = 'note' + (bad || warn ? ' bad' : '');
}

let saveSeq = 0;
async function save() {
  if (!canSave(S.week)) { openResultInfo('Pick a main first', 'Saving needs one night with a main.'); return; }
  if (!S.settings || !S.settings.channel) { S.setupOpen = true; route(); return; }
  const mon = S.week.monday, updated = !!S.saved[mon];
  S.saved[mon] = S.week;
  const kept = store.set('weeks', S.saved);
  delete S.drafts[mon]; store.set('drafts', S.drafts);
  S.hist = null;
  renderBar();
  const note = kept ? '' : 'This phone couldn’t store the week, so it is only kept until you close the page.';
  const attempt = ++saveSeq;
  openResult('sending', { updated, note });
  const ok = FX ? false : await push(updated);
  if (attempt !== saveSeq) return; // a newer save or retry owns the panel now
  if (S.sheet && S.sheet.kind === 'result') openResult(ok ? 'sent' : 'failed', { updated, note });
}
function openResultInfo(title, text) {
  S.sheet = { kind: 'result' };
  resultShell(esc(title), `<p>${esc(text)}</p><button class="btn block" data-act="close">OK</button>`);
}

async function push(updated) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 10000);
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(S.settings.channel), {
      method: 'POST',
      body: weekLines(),
      headers: { 'Title': updated ? "This week's dinners (updated)" : "This week's dinners", 'Click': currentLink(), 'Tags': 'fork_and_knife' },
      signal: ctl ? ctl.signal : undefined,
    });
    clearTimeout(timer);
    return r.ok;
  } catch (e) { clearTimeout(timer); return false; }
}
// Share messages only claim the week is stored when it was (resultNote adds the warning otherwise).
const keptLine = () => (S.result && S.result.note) ? '' : ' Your week is still saved here.';
async function share() {
  if (!navigator.share) { resultNote('Sharing is not available on this phone. Use Copy link.', true); return; }
  try {
    await navigator.share({ title: "This week's dinners", text: weekLines(), url: currentLink() });
    resultNote('Shared. Check that the message went out.' + keptLine());
  } catch (e) {
    if (e && e.name === 'AbortError') resultNote('Cancelled. Nothing was sent.' + keptLine(), true);
    else resultNote('Sharing didn’t work. Nothing was sent.' + keptLine() + ' Try Copy link.', true);
  }
}
async function copyLink() {
  const link = currentLink();
  try { await navigator.clipboard.writeText(link); resultNote('Link copied.'); return; } catch (e) { /* try the older way */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = link; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) { resultNote('Link copied.'); return; }
  } catch (e) { /* show the link below */ }
  resultNote('Couldn’t copy by itself. Press and hold the link below, then Copy.', true);
  const slot = $('#linkSlot');
  if (slot) { slot.innerHTML = `<input class="linkbox" readonly value="${esc(link)}" aria-label="Link">`; const i = slot.querySelector('input'); i.focus(); i.select(); }
}

// ---------- Store list view ----------
function renderList(app, hash) {
  const dec = decodeWeek(hash);
  if (!dec.ok) {
    app.innerHTML = `<div class="err-page"><h1>This link looks <em>damaged</em></h1>
      <p>It may have been cut off. Ask for the week to be saved again.</p>
      <a class="btn line" href=".">Open the week builder</a></div>`;
    return;
  }
  const week = dec.week, mon = week.monday;
  const list = buildStoreList(week, MEALS);
  const ticks = new Set(store.get('ticks.' + mon, []));
  const keyOf = (aisle, l) => `${aisle}|${l.name.toLowerCase()}|${l.unit.toLowerCase()}`;
  const all = [];
  list.forEach((g) => g.items.forEach((l) => all.push(keyOf(g.aisle, l))));
  const total = all.length, got = all.filter((k) => ticks.has(k)).length;

  let h = `<div class="top"><span class="wk">Week of ${shortDate(mon)}</span></div><h1>Store <em>list</em></h1>`;
  if (!total) {
    h += `<p class="sub">Nothing to buy yet.</p>`;
  } else {
    h += `<div class="bigcount" aria-live="polite"><div><b>${got}</b><span class="of">of ${total}</span></div><div class="lbl">in the<br>cart</div></div>
      <div class="bar"><i style="width:${total ? Math.round(got / total * 100) : 0}%"></i></div>`;
  }
  list.forEach((g) => {
    const gGot = g.items.filter((l) => ticks.has(keyOf(g.aisle, l))).length;
    h += `<div class="aisle"><h2>${esc(g.aisle)}<span>${gGot} of ${g.items.length}</span></h2>`;
    g.items.forEach((l) => {
      const k = keyOf(g.aisle, l), done = ticks.has(k);
      h += `<button class="it${done ? ' done' : ''}" data-act="tick" data-key="${esc(k)}" role="checkbox" aria-checked="${done}"><span class="cb"></span><span class="nm">${esc(l.name)}</span><span class="qty">${esc(fmtQty(l))}</span></button>`;
    });
    h += '</div>';
  });

  h += `<section class="cook"><h2>Day by day</h2><div class="cookwrap">`;
  week.days.forEach((day, i) => {
    if (isEatOut(day)) {
      h += `<div class="dayrow out"><span class="dd">${DAYS[i]}</span><span class="mid"><span class="a eo">Eating out</span></span><span></span></div>`;
      return;
    }
    if (!day || !dayCount(day)) return;
    const main = day.main ? item(day.main) : null;
    const open = S.openDay === i;
    const title = main ? main.name : 'Sides only';
    const w = withLine(day);
    const head = `<button class="dayrow" data-act="toggleday" data-day="${i}" aria-expanded="${open}"><span class="dd">${DAYS[i]}</span><span class="mid"><span class="a">${esc(title)}</span>${w ? `<span class="w">${esc(w)}</span>` : ''}</span><span class="b">${open ? '−' : '+'}</span></button>`;
    if (!open) { h += head; return; }
    h += `<div class="dayopen">${head}`;
    const mins = dayMinutes(day);
    if (mins > 30) h += `<div class="long">about ${mins} min</div>`;
    // This dinner's own shopping list, for a one-meal store stop.
    const dayList = buildStoreList({ v: 1, monday: mon, days: week.days.map((d, di) => (di === i ? d : null)) }, MEALS);
    const needs = [];
    dayList.forEach((g) => g.items.forEach((l) => needs.push(`${l.name} ${fmtQty(l)}`)));
    if (needs.length) h += `<p class="needs">${esc(needs.join(' · '))}</p>`;
    [day.main].concat(day.sides || []).filter(Boolean).forEach((id) => {
      const it = item(id);
      if (!it) { h += `<div class="dish"><h3>A retired item</h3></div>`; return; }
      h += `<div class="dish"><h3>${esc(it.name)}</h3><div class="q">${esc(applianceName(it))} · ${it.minutes} min</div>`;
      if (it.cookidoo && it.cookidoo.url) {
        h += `<a class="cdo" href="${esc(it.cookidoo.url)}" target="_blank" rel="noopener noreferrer">Open in Cookidoo</a>`;
      } else if (it.appliance === 'thermomix' && (!it.steps || !it.steps.length)) {
        h += `<p class="needs">Recipe is in Cookidoo.</p>`;
      }
      if (it.steps && it.steps.length) h += `<ol class="steps">${it.steps.map((s) => `<li><span>${esc(s)}</span></li>`).join('')}</ol>`;
      h += '</div>';
    });
    h += '</div>';
  });
  h += `</div></section><div class="foot"><a href=".">Open the week builder</a>${FX ? '<div class="sample" style="margin-top:14px">Sample data · assumed</div>' : ''}</div>`;
  app.innerHTML = h;
  S.list = { mon, ticks, hash };
}

function tick(key) {
  const j = S.list; if (!j) return;
  if (j.ticks.has(key)) j.ticks.delete(key); else j.ticks.add(key);
  store.set('ticks.' + j.mon, Array.from(j.ticks));
  const y = window.scrollY;
  renderList($('#app'), j.hash);
  window.scrollTo(0, y);
}

// ---------- events ----------
const PICKS = new Set(['choose', 'eat', 'clear', 'skip', 'back']);
document.addEventListener('touchstart', () => {}, { passive: true }); // lets iOS show the pressed state
document.addEventListener('click', (e) => {
  if (e.target.closest('#cele')) { hideCele(false); return; }
  if (e.target.id === 'scrim') return; // outside taps never close or change anything; Done closes
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.closest('#sheet')) {
    const t = performance.now();
    if (t < S.openUntil) return;                 // still sliding in
    if (PICKS.has(act) && t < S.busyUntil) return; // a step is gliding
  } else if (sheetOpen()) return;
  switch (act) {
    case 'tab': S.which = el.dataset.which; S.hist = null; loadWeek(); renderAll(); window.scrollTo(0, 0); break;
    case 'settings': S.setupOpen = true; route(); window.scrollTo(0, 0); break;
    case 'setup-cancel': S.setupOpen = false; route(); break;
    case 'night': { const d = Number(el.dataset.day); openFlow(d, firstStep(d)); break; }
    case 'done': case 'close': closeSheet(); break;
    case 'back': back(); break;
    case 'choose': choose(el.dataset.id); break;
    case 'eat': eatOut(); break;
    case 'clear': clearPick(); break;
    case 'skip': skip(); break;
    case 'save': save(); break;
    case 'again': { const upd = !!(S.result && S.result.updated), note = (S.result && S.result.note) || '', attempt = ++saveSeq; openResult('sending', { updated: upd, note }); push(upd).then((ok) => { if (attempt === saveSeq && S.sheet && S.sheet.kind === 'result') openResult(ok ? 'sent' : 'failed', { updated: upd, note }); }); break; }
    case 'share': share(); break;
    case 'copy': copyLink(); break;
    case 'tick': tick(el.dataset.key); break;
    case 'toggleday': { const d = Number(el.dataset.day); S.openDay = S.openDay === d ? null : d; const y = window.scrollY; renderList($('#app'), S.list.hash); window.scrollTo(0, y); break; }
    default: break;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.sheet) closeSheet(); else hideCele(false); } });

route();
})();

</script>
</body>
